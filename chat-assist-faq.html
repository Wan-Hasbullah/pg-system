<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assist Wan</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
:root {
  --primary: #0A2342;
  --primary-mid: #1B3E6E;
  --accent: #00B4D8;
  --accent-light: #90E0EF;
  --accent-glow: rgba(0,180,216,0.15);
  --gold: #F4A800;
  --surface: #F0F4FA;
  --surface2: #E4EAF5;
  --bubble-bot: #FFFFFF;
  --bubble-user: linear-gradient(135deg, #00B4D8 0%, #0077B6 100%);
  --text: #0A1628;
  --text-muted: #5A6B85;
  --text-light: #9AAEC4;
  --border: rgba(0,60,120,0.1);
  --border-accent: rgba(0,180,216,0.25);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--surface);
  min-height: 100vh;
  display: flex;
  align-items: stretch;
  justify-content: center;
}

#wh-chat-app {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 9999;
  display: flex; flex-direction: column;
  background: var(--surface);
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: var(--text);
  max-width: 760px;
  margin: 0 auto;
}

#wh-chat-app .wh-header {
  flex-shrink: 0; height: 72px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-mid) 100%);
  display: flex; align-items: center;
  padding: 0 1.25rem; gap: 14px;
  z-index: 10; position: relative;
  box-shadow: 0 2px 20px rgba(10,35,66,0.2);
}
#wh-chat-app .wh-header::after {
  content: ''; position: absolute;
  bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,180,216,0.4), transparent);
}
#wh-chat-app .wh-avatar-wrap { position: relative; flex-shrink: 0; }
#wh-chat-app .wh-avatar {
  width: 46px; height: 46px; border-radius: 50%;
  object-fit: cover; border: 2.5px solid var(--accent-light); display: block;
}
#wh-chat-app .wh-status-dot {
  position: absolute; bottom: 1px; right: 1px;
  width: 11px; height: 11px; background: #2ECC71;
  border: 2px solid var(--primary); border-radius: 50%;
}
#wh-chat-app .wh-header-info { flex: 1; }
#wh-chat-app .wh-header-name {
  font-family: 'Sora', sans-serif; font-size: 15px;
  font-weight: 600; color: white; letter-spacing: -0.01em;
}
#wh-chat-app .wh-header-status {
  font-size: 12px; color: rgba(255,255,255,0.6);
  margin-top: 1px; display: flex; align-items: center; gap: 5px;
}
#wh-chat-app .wh-header-status::before {
  content: ''; width: 6px; height: 6px;
  background: #2ECC71; border-radius: 50%; display: inline-block;
}
#wh-chat-app .wh-header-actions { display: flex; gap: 8px; }
#wh-chat-app .wh-header-btn {
  width: 38px; height: 38px; background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; text-decoration: none;
}
#wh-chat-app .wh-header-btn:hover { background: rgba(255,255,255,0.18); }
#wh-chat-app .wh-header-btn svg { width: 18px; height: 18px; }

#wh-chat-app .wh-messages {
  flex: 1; overflow-y: auto; padding: 1.25rem;
  display: flex; flex-direction: column; gap: 10px;
  scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
}
#wh-chat-app .wh-messages::-webkit-scrollbar { width: 4px; }
#wh-chat-app .wh-messages::-webkit-scrollbar-track { background: transparent; }
#wh-chat-app .wh-messages::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }

#wh-chat-app .wh-date-divider {
  text-align: center; font-size: 11px; color: var(--text-light);
  font-weight: 500; letter-spacing: 0.05em; padding: 4px 0;
  display: flex; align-items: center; gap: 10px;
}
#wh-chat-app .wh-date-divider::before,
#wh-chat-app .wh-date-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

#wh-chat-app .wh-msg-row {
  display: flex; align-items: flex-end; gap: 8px;
  animation: whMsgIn 0.25s ease forwards;
  opacity: 0; transform: translateY(8px);
}
@keyframes whMsgIn { to { opacity: 1; transform: translateY(0); } }
#wh-chat-app .wh-msg-row.bot { justify-content: flex-start; }
#wh-chat-app .wh-msg-row.user { justify-content: flex-end; }

#wh-chat-app .wh-msg-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  object-fit: cover; border: 1.5px solid var(--border-accent);
  flex-shrink: 0; margin-bottom: 2px;
}
#wh-chat-app .wh-msg-avatar.hidden { opacity: 0; pointer-events: none; }
#wh-chat-app .wh-bubble-wrap { display: flex; flex-direction: column; max-width: 75%; }
#wh-chat-app .wh-msg-row.user .wh-bubble-wrap { align-items: flex-end; }

#wh-chat-app .wh-bubble {
  padding: 0.75rem 1rem; border-radius: 18px;
  font-size: 14.5px; line-height: 1.65;
  position: relative; word-break: break-word;
}
#wh-chat-app .wh-bubble.bot {
  background: var(--bubble-bot); color: var(--text);
  border: 1px solid var(--border); border-bottom-left-radius: 6px;
  box-shadow: 0 2px 10px rgba(10,35,66,0.06);
}
#wh-chat-app .wh-bubble.user {
  background: var(--bubble-user); color: white;
  border-bottom-right-radius: 6px;
  box-shadow: 0 4px 16px rgba(0,119,182,0.3);
}
#wh-chat-app .wh-bubble.bot .wh-sender {
  font-size: 11px; font-weight: 600; color: var(--accent);
  display: block; margin-bottom: 4px;
  letter-spacing: 0.03em; text-transform: uppercase;
}
#wh-chat-app .wh-bubble .wh-time {
  font-size: 10.5px; color: var(--text-light);
  margin-top: 4px; display: block; text-align: right;
}
#wh-chat-app .wh-bubble.user .wh-time { color: rgba(255,255,255,0.6); }

/* ─── FAQ CARD ─── */
#wh-chat-app .wh-faq-card {
  background: white; border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 14px; border-top-left-radius: 6px;
  padding: 0.875rem 1rem; max-width: 78%;
  box-shadow: 0 2px 12px rgba(10,35,66,0.06);
  animation: whMsgIn 0.25s ease forwards;
  opacity: 0; transform: translateY(8px);
}
#wh-chat-app .wh-faq-card-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--accent); text-transform: uppercase; margin-bottom: 6px;
  display: flex; align-items: center; gap: 5px;
}
#wh-chat-app .wh-faq-card-label::before {
  content: ''; width: 5px; height: 5px;
  background: var(--accent); border-radius: 50%;
}
#wh-chat-app .wh-faq-card-cat {
  font-size: 10px; font-weight: 600; color: var(--text-light);
  background: var(--surface2); border-radius: 20px;
  padding: 2px 8px; display: inline-block; margin-bottom: 6px;
}
#wh-chat-app .wh-faq-card-title {
  font-family: 'Sora', sans-serif; font-size: 13.5px;
  font-weight: 600; color: var(--primary); margin-bottom: 4px; line-height: 1.4;
}
#wh-chat-app .wh-faq-card-soalan {
  font-size: 12.5px; font-weight: 500; color: var(--primary-mid);
  background: rgba(0,180,216,0.07); border-radius: 8px;
  padding: 6px 10px; margin-bottom: 8px; line-height: 1.5;
  border-left: 2px solid var(--accent);
}
#wh-chat-app .wh-faq-card-body {
  font-size: 13.5px; color: var(--text-muted); line-height: 1.65;
}
#wh-chat-app .wh-faq-card-body mark {
  background: rgba(0,180,216,0.15);
  color: var(--primary); border-radius: 3px;
  padding: 0 2px; font-weight: 600;
}
/* Auto-link dalam jawapan */
#wh-chat-app .wh-faq-card-body a {
  color: var(--accent); text-decoration: underline;
  word-break: break-all;
}
#wh-chat-app .wh-faq-card-body a:hover { color: var(--primary-mid); }

#wh-chat-app .wh-faq-card-time {
  font-size: 10px; color: var(--text-light);
  margin-top: 8px; text-align: right;
}

/* ─── TYPING ─── */
#wh-chat-app .wh-typing-indicator {
  display: flex; align-items: flex-end; gap: 8px;
  animation: whMsgIn 0.25s ease forwards;
  opacity: 0; transform: translateY(8px);
}
#wh-chat-app .wh-typing-bubble {
  background: white; border: 1px solid var(--border);
  border-radius: 18px; border-bottom-left-radius: 6px;
  padding: 0.875rem 1rem;
  display: flex; align-items: center; gap: 5px;
  box-shadow: 0 2px 10px rgba(10,35,66,0.06);
}
#wh-chat-app .wh-typing-dot {
  width: 7px; height: 7px; background: var(--accent-light);
  border-radius: 50%; animation: whTypingPulse 1.2s ease-in-out infinite;
}
#wh-chat-app .wh-typing-dot:nth-child(2) { animation-delay: 0.15s; }
#wh-chat-app .wh-typing-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes whTypingPulse {
  0%,60%,100% { transform:translateY(0); opacity:0.4; }
  30% { transform:translateY(-5px); opacity:1; }
}

/* ─── SUGGESTIONS ─── */
#wh-chat-app .wh-suggestions {
  padding: 0 1.25rem 0.75rem;
  display: flex; gap: 8px; overflow-x: auto; flex-shrink: 0;
}
#wh-chat-app .wh-suggestions::-webkit-scrollbar { display: none; }
#wh-chat-app .wh-suggestion-pill {
  flex-shrink: 0; background: white;
  border: 1.5px solid var(--border-accent); border-radius: 50px;
  padding: 6px 14px; font-size: 12.5px; font-weight: 500;
  color: var(--primary-mid); cursor: pointer;
  white-space: nowrap; transition: all 0.2s; display: none;
  font-family: 'Plus Jakarta Sans', sans-serif;
}
#wh-chat-app .wh-suggestion-pill.visible { display: block; }
#wh-chat-app .wh-suggestion-pill:hover {
  background: var(--accent-glow); border-color: var(--accent); color: var(--accent);
}

/* ─── INPUT BAR ─── */
#wh-chat-app .wh-input-bar {
  flex-shrink: 0; background: white;
  border-top: 1px solid var(--border);
  padding: 0.875rem 1rem;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 -4px 20px rgba(10,35,66,0.05);
}
#wh-chat-app .wh-input-wrap {
  flex: 1; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: 50px;
  display: flex; align-items: center;
  padding: 0 16px; transition: all 0.2s; gap: 8px;
}
#wh-chat-app .wh-input-wrap:focus-within {
  border-color: var(--accent); background: white;
  box-shadow: 0 0 0 4px var(--accent-glow);
}
#wh-chat-app .wh-input-wrap svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--text-light); }
#wh-chat-app #whUserInput {
  flex: 1; background: transparent; border: none; outline: none;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14.5px; color: var(--text); padding: 0.625rem 0; min-width: 0;
}
#wh-chat-app #whUserInput::placeholder { color: var(--text-light); }

/* ─── SEND BUTTON ─── */
#wh-chat-app .wh-send-btn {
  width: 48px; height: 48px;
  background: linear-gradient(135deg, #00C6E0 0%, #0077B6 100%);
  border: none; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; transition: all 0.22s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 4px 18px rgba(0,180,216,0.38), 0 1px 4px rgba(0,0,0,0.10);
  position: relative; overflow: hidden;
}
#wh-chat-app .wh-send-btn::before {
  content: '';
  position: absolute; inset: 0; border-radius: 50%;
  background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, transparent 60%);
  pointer-events: none;
}
#wh-chat-app .wh-send-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 8px 28px rgba(0,180,216,0.50), 0 2px 8px rgba(0,0,0,0.12);
}
#wh-chat-app .wh-send-btn:active {
  transform: scale(0.94);
  box-shadow: 0 2px 10px rgba(0,180,216,0.28);
}
#wh-chat-app .wh-send-btn svg { width: 19px; height: 19px; transform: translateX(1px); }

/* ─── NOT FOUND ─── */
#wh-chat-app .wh-notfound-bubble {
  background: white; border: 1px solid rgba(244,168,0,0.25);
  border-left: 3px solid var(--gold);
  border-radius: 14px; border-top-left-radius: 6px;
  padding: 0.875rem 1rem; max-width: 78%;
  box-shadow: 0 2px 12px rgba(10,35,66,0.06);
  animation: whMsgIn 0.25s ease forwards;
  opacity: 0; transform: translateY(8px);
}
#wh-chat-app .wh-notfound-title {
  font-size: 13.5px; color: var(--text); line-height: 1.65; margin-bottom: 10px;
}
#wh-chat-app .wh-wa-btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: #25D366; color: white; border-radius: 8px;
  padding: 8px 14px; font-size: 13px; font-weight: 600;
  text-decoration: none; transition: all 0.2s;
}
#wh-chat-app .wh-wa-btn:hover { background: #1ebe5a; transform: translateY(-1px); }
#wh-chat-app .wh-wa-btn svg { width: 16px; height: 16px; }
#wh-chat-app .wh-notfound-time {
  font-size: 10px; color: var(--text-light); margin-top: 8px; text-align: right;
}

/* ─── CATEGORY MENU ─── */
#wh-chat-app .wh-category-menu {
  background: white; border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 14px; border-top-left-radius: 6px;
  padding: 0.875rem 1rem; max-width: 84%;
  box-shadow: 0 2px 12px rgba(10,35,66,0.06);
  animation: whMsgIn 0.25s ease forwards;
  opacity: 0; transform: translateY(8px);
}
#wh-chat-app .wh-category-menu-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--accent); text-transform: uppercase; margin-bottom: 10px;
  display: flex; align-items: center; gap: 5px;
}
#wh-chat-app .wh-category-menu-label::before {
  content: ''; width: 5px; height: 5px;
  background: var(--accent); border-radius: 50%;
}
#wh-chat-app .wh-cat-btn {
  display: flex; align-items: center; gap: 8px;
  width: 100%; background: var(--surface);
  border: 1.5px solid var(--border-accent); border-radius: 10px;
  padding: 9px 13px; margin-bottom: 7px; cursor: pointer;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13.5px; font-weight: 500; color: var(--primary-mid);
  transition: all 0.18s; text-align: left;
}
#wh-chat-app .wh-cat-btn:last-child { margin-bottom: 0; }
#wh-chat-app .wh-cat-btn:hover {
  background: var(--accent-glow); border-color: var(--accent); color: var(--accent);
}
#wh-chat-app .wh-cat-btn .wh-cat-icon { font-size: 16px; flex-shrink: 0; }

/* ─── TOPIC LIST ─── */
#wh-chat-app .wh-topic-menu {
  background: white; border: 1px solid var(--border);
  border-left: 3px solid var(--gold);
  border-radius: 14px; border-top-left-radius: 6px;
  padding: 0.875rem 1rem; max-width: 84%;
  box-shadow: 0 2px 12px rgba(10,35,66,0.06);
  animation: whMsgIn 0.25s ease forwards;
  opacity: 0; transform: translateY(8px);
}
#wh-chat-app .wh-topic-menu-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--gold); text-transform: uppercase; margin-bottom: 10px;
  display: flex; align-items: center; gap: 5px;
}
#wh-chat-app .wh-topic-menu-label::before {
  content: ''; width: 5px; height: 5px;
  background: var(--gold); border-radius: 50%;
}
#wh-chat-app .wh-topic-btn {
  display: flex; align-items: center; gap: 8px;
  width: 100%; background: var(--surface);
  border: 1.5px solid rgba(244,168,0,0.2); border-radius: 10px;
  padding: 9px 13px; margin-bottom: 7px; cursor: pointer;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13.5px; font-weight: 500; color: var(--primary-mid);
  transition: all 0.18s; text-align: left;
}
#wh-chat-app .wh-topic-btn:last-child { margin-bottom: 0; }
#wh-chat-app .wh-topic-btn:hover {
  background: rgba(244,168,0,0.08); border-color: var(--gold); color: #b07a00;
}
#wh-chat-app .wh-back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; border: none;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 12px; color: var(--text-light);
  cursor: pointer; margin-top: 8px; padding: 2px 0;
  transition: color 0.18s;
}
#wh-chat-app .wh-back-btn:hover { color: var(--accent); }

/* ─── SOALAN LIST (dalam topik) ─── */
#wh-chat-app .wh-soalan-menu {
  background: white; border: 1px solid var(--border);
  border-left: 3px solid #9B59B6;
  border-radius: 14px; border-top-left-radius: 6px;
  padding: 0.875rem 1rem; max-width: 84%;
  box-shadow: 0 2px 12px rgba(10,35,66,0.06);
  animation: whMsgIn 0.25s ease forwards;
  opacity: 0; transform: translateY(8px);
}
#wh-chat-app .wh-soalan-menu-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  color: #9B59B6; text-transform: uppercase; margin-bottom: 10px;
  display: flex; align-items: center; gap: 5px;
}
#wh-chat-app .wh-soalan-menu-label::before {
  content: ''; width: 5px; height: 5px;
  background: #9B59B6; border-radius: 50%;
}
#wh-chat-app .wh-soalan-btn {
  display: flex; align-items: flex-start; gap: 8px;
  width: 100%; background: var(--surface);
  border: 1.5px solid rgba(155,89,182,0.15); border-radius: 10px;
  padding: 9px 13px; margin-bottom: 7px; cursor: pointer;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px; font-weight: 500; color: var(--primary-mid);
  transition: all 0.18s; text-align: left; line-height: 1.45;
}
#wh-chat-app .wh-soalan-btn:last-of-type { margin-bottom: 0; }
#wh-chat-app .wh-soalan-btn:hover {
  background: rgba(155,89,182,0.06); border-color: #9B59B6; color: #6C3483;
}
#wh-chat-app .wh-soalan-num {
  font-size: 11px; font-weight: 700; color: #9B59B6;
  background: rgba(155,89,182,0.1); border-radius: 50%;
  width: 20px; height: 20px; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; margin-top: 1px;
}

@keyframes whBlink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ══════════════════════════════════════
   FINTECH PREMIUM POLISH + MOBILE
   ══════════════════════════════════════ */

/* Header — deeper gradient & shimmer line */
#wh-chat-app .wh-header {
  background: linear-gradient(135deg, #061829 0%, #0A2342 45%, #1B3E6E 100%);
  box-shadow: 0 2px 28px rgba(0,20,60,0.35), inset 0 1px 0 rgba(0,180,216,0.12);
}
#wh-chat-app .wh-header::after {
  background: linear-gradient(90deg, transparent 0%, rgba(0,180,216,0.55) 40%, rgba(244,168,0,0.3) 60%, transparent 100%);
  height: 1.5px;
}

/* Avatar glow ring */
#wh-chat-app .wh-avatar {
  box-shadow: 0 0 0 2.5px var(--accent-light), 0 0 14px rgba(0,180,216,0.35);
}

/* Status pulse animation */
#wh-chat-app .wh-status-dot {
  box-shadow: 0 0 0 0 rgba(46,204,113,0.6);
  animation: whStatusPulse 2.4s ease-in-out infinite;
}
@keyframes whStatusPulse {
  0%   { box-shadow: 0 0 0 0 rgba(46,204,113,0.55); }
  60%  { box-shadow: 0 0 0 5px rgba(46,204,113,0); }
  100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
}

/* Bot bubble — glass card feel */
#wh-chat-app .wh-bubble.bot {
  background: linear-gradient(145deg, #ffffff 0%, #f7faff 100%);
  border: 1px solid rgba(0,60,120,0.09);
  box-shadow: 0 3px 14px rgba(10,35,66,0.08), inset 0 1px 0 rgba(255,255,255,0.9);
}

/* User bubble — richer gradient */
#wh-chat-app .wh-bubble.user {
  background: linear-gradient(135deg, #00C6E0 0%, #0095C8 50%, #0066A8 100%);
  box-shadow: 0 5px 20px rgba(0,100,180,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
}

/* FAQ card — premium border glow */
#wh-chat-app .wh-faq-card {
  background: linear-gradient(145deg, #ffffff 0%, #f5f9ff 100%);
  border: 1px solid rgba(0,60,120,0.09);
  border-left: 3px solid var(--accent);
  box-shadow: 0 4px 20px rgba(10,35,66,0.09), inset 0 1px 0 rgba(255,255,255,0.95);
}

/* Category card */
#wh-chat-app .wh-category-menu,
#wh-chat-app .wh-topic-menu,
#wh-chat-app .wh-soalan-menu {
  background: linear-gradient(145deg, #ffffff 0%, #f5f9ff 100%);
  box-shadow: 0 4px 20px rgba(10,35,66,0.09), inset 0 1px 0 rgba(255,255,255,0.95);
}

/* Category / topic buttons — lifted on hover */
#wh-chat-app .wh-cat-btn:hover,
#wh-chat-app .wh-topic-btn:hover,
#wh-chat-app .wh-soalan-btn:hover {
  transform: translateX(3px);

<script>
(function() {
  // ══════════════════════════════════════════════
  // CONFIG — GANTI URL SHEET CSV DI SINI
  // ══════════════════════════════════════════════
  const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR76pxM4R7BEoqQcmlwDXT36q_nBAQbLrkHfuxUpoJtpUD-acolPaj9l2qwGIWvnqbhwdBsS2zHHIl0/pub?gid=1216470090&single=true&output=csv';
  const AVATAR    = 'https://blogger.googleusercontent.com/img/a/AVvXsEjH8kKw3_SWdf96cjqIx_j4exadqr0togYGxXJxWA8D7z40VpkkLeyeyRDrZRCdVXdKPA2LuOtxXZ-eRffWfnM0_UPa6g7KGkCLAx0Br1DoJO3MC3P7jZXg6EZ3FsL0zdiI-RRzcf9ArG87YT4WvpQ5V1PEpe7kCQc0C3SePyxBo5ONOFkmAgYKXDOFTyo=s16000';

  // Stop words BM + EN
  const STOP_WORDS = new Set([
    'yang','dan','di','ke','dari','pada','untuk','dengan','ini','itu',
    'ada','tidak','boleh','saya','anda','encik','puan','cara','macam',
    'mana','bagaimana','apa','bila','berapa','how','what','where','when',
    'the','is','are','a','an','in','of','to','for','can','i','you','tak',
    'nak','nak','ye','ya','ok','je','la','lah'
  ]);

  // DUA kategori utama sahaja (sesuai dengan form)
  const MAIN_CATEGORIES = [
    'Tutorial/Langkah demi Langkah',
    'Soalan Lazim'
  ];

  const CAT_ICONS = {
    'Tutorial/Langkah demi Langkah': '📋',
    'Soalan Lazim': '❓'
  };

  // Senarai tajuk mengikut kategori (untuk navigasi)
  const TAJUK_MAP = {
    'Tutorial/Langkah demi Langkah': [
      'Pendaftaran',
      'Akaun Public Gold',
      'Gold Accumulation Program (Akaun Emas GAP)',
      'Outright Purchase (Bayaran Penuh/Bulanan)',
      'Jualan Emas',
      'Dealer Public Gold',
      'Cara Menghubungi Public Gold Customer Service'
    ],
    'Soalan Lazim': [
      'Asas Simpanan Emas',
      'Pilihan Emas Terbaik',
      'Strategi Beli, Jual dan Pajak',
      'Transaksi Emas Public Gold',
      'Akaun Emas GAP',
      'Bisnes Emas Public Gold'
    ]
  };

  let faqData    = [];
  let isTyping   = false;

  const $ = id => document.getElementById(id);
  const whNow = () => new Date().toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'});
  const whEsc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const whScroll = () => setTimeout(()=>$('whMessages').scrollTo({top:$('whMessages').scrollHeight,behavior:'smooth'}),80);

  /* ─── STORAGE KEY ─── */
  const STORAGE_KEY = 'assistwan_faq_chat_html';

  /* ─── SIMPAN HTML MESEJ KE LOCALSTORAGE ─── */
  /* Hanya simpan mesej statik (bubbles, FAQ cards) — bukan menu navigasi interaktif */
  function whSaveChat() {
    try {
      const msgs = $('whMessages');
      /* Klon node, buang semua elemen menu interaktif yang ada onclick supaya tidak simpan orphan handlers */
      const clone = msgs.cloneNode(true);
      clone.querySelectorAll('.wh-category-menu,.wh-topic-menu,.wh-soalan-menu').forEach(el => el.closest('div[style*="flex"]')?.remove() || el.remove());
      localStorage.setItem(STORAGE_KEY, clone.innerHTML);
    } catch(e) {}
  }

  /* ─── PULIHKAN MESEJ DARI LOCALSTORAGE ─── */
  function whRestoreChat() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        $('whMessages').innerHTML = saved;
        whScroll();
        return true;
      }
    } catch(e) {}
    return false;
  }

  // Auto-linkify URL dalam teks
  function autoLink(text) {
    // Tukar \n kepada placeholder, escape HTML, kembalikan placeholder kepada <br>
    const safe = whEsc(text).replace(/\n/g, '<br>');
    return safe.replace(/(https?:\/\/[^\s<>"]+)/gi, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  /* ── CSV PARSER — handle newline dalam quoted cell ── */
  function parseCSV(text) {
    const rows = [];
    let cur = '', inQ = false, cols = [];
    const src = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    for (let i = 0; i < src.length; i++) {
      const c = src[i];
      if (c === '"') {
        if (inQ && src[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (c === ',' && !inQ) {
        cols.push(cur); cur = '';
      } else if (c === '\n' && !inQ) {
        cols.push(cur); cur = '';
        if (cols.some(x => x !== '')) rows.push(cols);
        cols = [];
      } else {
        cur += c;
      }
    }
    cols.push(cur);
    if (cols.some(x => x !== '')) rows.push(cols);
    return rows.map(row => row.map(cell => cell.replace(/^[\s\uFEFF]+|[\s\uFEFF]+$/g, '')));
  }

  /* ── LOAD FAQ ──
     Format CSV dijangka: Timestamp | Kategori | Tajuk | Soalan | Jawapan
     (sama seperti yang Apps Script simpan)
  */
  async function whLoadFAQ() {
    try {
      const text = await (await fetch(SHEET_URL)).text();
      const rows = parseCSV(text).slice(1); // skip header
      faqData = [];
      rows.forEach(c => {
        // Jangkakan: col[0]=Timestamp, col[1]=Kategori, col[2]=Tajuk, col[3]=Soalan, col[4]=Jawapan
        const timestamp = (c[0]||'').trim();
        const kategori  = (c[1]||'').trim();
        const tajuk     = (c[2]||'').trim();
        const soalan    = (c[3]||'').trim();
        const jawapan   = (c[4]||'').trim();
        if (!kategori || !tajuk || !jawapan) return;
        faqData.push({ timestamp, kategori, tajuk, soalan, jawapan });
      });
      whShowCategoryPills();
    } catch(e) { console.warn('FAQ error:', e); }
  }

  /* ── SMART SEARCH ── */
  function whSearch(query) {
    if (!query || !faqData.length) return [];
    const clean = query.toLowerCase().replace(/[^\w\s]/g,'').replace(/\s+/g,' ').trim();
    const keywords = clean.split(' ').filter(w => w.length >= 2 && !STOP_WORDS.has(w));
    if (!keywords.length) return [];
    const scored = faqData.map(item => {
      const hay = (item.tajuk + ' ' + item.soalan + ' ' + item.jawapan + ' ' + item.kategori).toLowerCase();
      let score = 0;
      if (hay.includes(clean)) score += 20;
      keywords.forEach(kw => {
        if (hay.includes(kw)) {
          if (item.tajuk.toLowerCase().includes(kw)) score += 8;
          else if (item.soalan.toLowerCase().includes(kw)) score += 5;
          else score += 3;
        }
      });
      return { ...item, score, keywords };
    }).filter(i => i.score > 0);
    return scored.sort((a,b)=>b.score-a.score).slice(0,3);
  }

  /* ── HIGHLIGHT ── */
  function whHighlight(text, keywords) {
    let safe = autoLink(text);
    if (!keywords || !keywords.length) return safe;
    keywords.forEach(kw => {
      const re = new RegExp('(?<!["\'])(' + kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')(?!["\'])', 'gi');
      safe = safe.replace(re, '<mark>$1</mark>');
    });
    return safe;
  }

  /* ── TYPING ── */
  function whAddTyping() {
    whRemoveTyping();
    const d = document.createElement('div');
    d.className='wh-typing-indicator'; d.id='whTyping';
    d.innerHTML=`<img src="${AVATAR}" class="wh-msg-avatar">
      <div class="wh-typing-bubble">
        <div class="wh-typing-dot"></div><div class="wh-typing-dot"></div><div class="wh-typing-dot"></div>
      </div>`;
    $('whMessages').appendChild(d); whScroll();
  }
  function whRemoveTyping(){ const t=$('whTyping'); if(t) t.remove(); }

  /* ── BUBBLES ── */
  function whAddBotBubble(html) {
    const msgs=$('whMessages'), row=document.createElement('div');
    row.className='wh-msg-row bot';
    row.innerHTML=`<img src="${AVATAR}" class="wh-msg-avatar">
      <div class="wh-bubble-wrap">
        <div class="wh-bubble bot">
          <span class="wh-sender">Assist Wan</span>${html}
          <span class="wh-time">${whNow()}</span>
        </div>
      </div>`;
    msgs.appendChild(row); whScroll(); whSaveChat();
  }

  function whAddUserBubble(text) {
    const msgs=$('whMessages'), row=document.createElement('div');
    row.className='wh-msg-row user';
    row.innerHTML=`<div class="wh-bubble-wrap">
      <div class="wh-bubble user">${text}<span class="wh-time">${whNow()} ✓✓</span>
      </div></div>`;
    msgs.appendChild(row); whScroll(); whSaveChat();
  }

  function whAddFAQCard(item) {
    const msgs=$('whMessages');
    const wrap=document.createElement('div');
    wrap.style.cssText='display:flex;gap:8px;align-items:flex-end';
    const img=document.createElement('img');
    img.src=AVATAR; img.className='wh-msg-avatar';
    const card=document.createElement('div');
    card.className='wh-faq-card';

    const soalanHtml = item.soalan
      ? `<div class="wh-faq-card-soalan">❓ ${whEsc(item.soalan)}</div>`
      : '';

    card.innerHTML=`
      <div class="wh-faq-card-label">Jawapan Dijumpai</div>
      <div class="wh-faq-card-cat">${whEsc(item.kategori)} › ${whEsc(item.tajuk)}</div>
      ${soalanHtml}
      <div class="wh-faq-card-body">${whHighlight(item.jawapan, item.keywords||[])}</div>
      <div class="wh-faq-card-time">${whNow()}</div>`;
    wrap.appendChild(img); wrap.appendChild(card);
    msgs.appendChild(wrap); whScroll(); whSaveChat();
  }

  function whAddNotFound(query) {
    const msgs=$('whMessages');
    const wrap=document.createElement('div');
    wrap.style.cssText='display:flex;gap:8px;align-items:flex-end';
    const img=document.createElement('img');
    img.src=AVATAR; img.className='wh-msg-avatar';
    const card=document.createElement('div');
    card.className='wh-notfound-bubble';
    card.innerHTML=`
      <div class="wh-notfound-title">
        Maaf, tiada rekod berkaitan <strong>"${whEsc(query)}"</strong> dalam simpanan saya.<br>
        Sila hubungi Encik Wan Hasbullah secara terus:
      </div>
      <a href="https://wa.me/601126704897" class="wh-wa-btn" target="_blank">
        <svg fill="white" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        WhatsApp Encik Wan Hasbullah
      </a>
      <div class="wh-notfound-time">${whNow()}</div>`;
    wrap.appendChild(img); wrap.appendChild(card);
    msgs.appendChild(wrap); whScroll(); whSaveChat();
  }

  /* ── CATEGORY MENU (DUA KATEGORI SAHAJA) ── */
  function whShowCategoryInChat() {
    const msgs=$('whMessages');
    const wrap=document.createElement('div');
    wrap.style.cssText='display:flex;gap:8px;align-items:flex-end';
    const img=document.createElement('img');
    img.src=AVATAR; img.className='wh-msg-avatar';

    const card=document.createElement('div');
    card.className='wh-category-menu';
    card.innerHTML=`<div class="wh-category-menu-label">Pilih Kategori</div>`;

    MAIN_CATEGORIES.forEach(kat => {
      const icon = CAT_ICONS[kat] || '📋';
      const count = faqData.filter(d => d.kategori === kat).length;
      const btn=document.createElement('button');
      btn.className='wh-cat-btn';
      btn.innerHTML=`<span class="wh-cat-icon">${icon}</span> ${whEsc(kat)} <span style="margin-left:auto;color:var(--text-light);font-size:12px">${count} entri ›</span>`;
      btn.onclick=()=>{ whCategorySelected(kat); };
      card.appendChild(btn);
    });

    wrap.appendChild(img); wrap.appendChild(card);
    msgs.appendChild(wrap); whScroll();
  }

  /* ── TOPIC LIST (TAJUK dalam kategori) ── */
  function whCategorySelected(kat) {
    whAddUserBubble(whEsc(kat));
    whAddTyping();
    setTimeout(()=>{
      whRemoveTyping();
      const msgs=$('whMessages');
      const tajukList = TAJUK_MAP[kat] || [];

      const wrap=document.createElement('div');
      wrap.style.cssText='display:flex;gap:8px;align-items:flex-start';
      const img=document.createElement('img');
      img.src=AVATAR; img.className='wh-msg-avatar';

      const card=document.createElement('div');
      card.className='wh-topic-menu';
      card.innerHTML=`<div class="wh-topic-menu-label">${whEsc(kat)}</div>`;

      tajukList.forEach(tajuk => {
        const faqCount = faqData.filter(d => d.kategori === kat && d.tajuk === tajuk).length;
        const btn=document.createElement('button');
        btn.className='wh-topic-btn';
        btn.innerHTML=`${whEsc(tajuk)} <span style="margin-left:auto;color:var(--text-light);font-size:11px;flex-shrink:0">${faqCount} soalan ›</span>`;
        btn.onclick=()=>{ whTajukSelected(kat, tajuk); };
        card.appendChild(btn);
      });

      const backBtn=document.createElement('button');
      backBtn.className='wh-back-btn';
      backBtn.innerHTML='← Kembali ke Kategori';
      backBtn.onclick=()=>{
        whAddUserBubble('← Kembali ke Kategori');
        whAddTyping();
        setTimeout(()=>{ whRemoveTyping(); whShowCategoryInChat(); }, 600);
      };
      card.appendChild(backBtn);

      wrap.appendChild(img); wrap.appendChild(card);
      msgs.appendChild(wrap); whScroll();
    }, 600);
  }

  /* ── SOALAN LIST (dalam tajuk) ── */
  function whTajukSelected(kat, tajuk) {
    whAddUserBubble(whEsc(tajuk));
    whAddTyping();
    setTimeout(()=>{
      whRemoveTyping();
      const soalanList = faqData.filter(d => d.kategori === kat && d.tajuk === tajuk);

      if (!soalanList.length) {
        whAddBotBubble('Tiada soalan ditemui untuk topik ini lagi. Sila hubungi terus melalui WhatsApp.');
        return;
      }

      // Jika hanya 1 soalan — terus tunjuk jawapan
      if (soalanList.length === 1) {
        whAddFAQCard({ ...soalanList[0], keywords: [] });
        return;
      }

      const msgs=$('whMessages');
      const wrap=document.createElement('div');
      wrap.style.cssText='display:flex;gap:8px;align-items:flex-start';
      const img=document.createElement('img');
      img.src=AVATAR; img.className='wh-msg-avatar';

      const card=document.createElement('div');
      card.className='wh-soalan-menu';
      card.innerHTML=`<div class="wh-soalan-menu-label">${whEsc(tajuk)} — Pilih Soalan</div>`;

      soalanList.forEach((item, idx) => {
        const btn=document.createElement('button');
        btn.className='wh-soalan-btn';
        btn.innerHTML=`<span class="wh-soalan-num">${idx+1}</span> ${whEsc(item.soalan || item.jawapan.slice(0,60)+'...')}`;
        btn.onclick=()=>{ whSoalanSelected(item); };
        card.appendChild(btn);
      });

      const backBtn=document.createElement('button');
      backBtn.className='wh-back-btn';
      backBtn.innerHTML=`← Kembali ke ${whEsc(kat)}`;
      backBtn.onclick=()=>{
        whAddUserBubble(`← Kembali ke ${whEsc(kat)}`);
        whAddTyping();
        setTimeout(()=>{ whRemoveTyping(); whCategorySelected(kat); }, 600);
      };
      card.appendChild(backBtn);

      wrap.appendChild(img); wrap.appendChild(card);
      msgs.appendChild(wrap); whScroll();
    }, 700);
  }

  /* ── SOALAN SELECTED → Papar Jawapan ── */
  function whSoalanSelected(item) {
    whAddUserBubble(whEsc(item.soalan || item.tajuk));
    whAddTyping();
    setTimeout(()=>{
      whRemoveTyping();
      whAddFAQCard({ ...item, keywords: [] });
    }, 800);
  }

  /* ── SUGGESTION PILLS (DUA KATEGORI SAHAJA) ── */
  function whShowCategoryPills() {
    const c=$('whSuggestions'); c.innerHTML='';
    MAIN_CATEGORIES.forEach(kat => {
      const btn=document.createElement('button');
      btn.className='wh-suggestion-pill visible';
      btn.textContent=kat;
      btn.onclick=()=>{ whCategorySelected(kat); };
      c.appendChild(btn);
    });
  }

  /* ── SEND (taip manual) ── */
  window.whSendMessage = async function() {
    const input=$('whUserInput');
    const query=input.value.trim();
    if (!query || isTyping) return;
    isTyping=true; input.value=''; input.focus();

    whAddUserBubble(whEsc(query));
    whAddTyping();
    await new Promise(r=>setTimeout(r, 800+Math.random()*500));
    whRemoveTyping();

    const results=whSearch(query);
    if (results.length) {
      whAddBotBubble(`Saya jumpa <strong>${results.length}</strong> rekod berkaitan pertanyaan anda:`);
      for (let i=0;i<results.length;i++) {
        await new Promise(r=>setTimeout(r,i*300));
        whAddFAQCard(results[i]);
      }
    } else {
      whAddNotFound(query);
    }
    isTyping=false;
  };

  $('whUserInput').addEventListener('keydown', e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();whSendMessage();}
  });

  /* ── WELCOME ── */
  async function whWelcome() {
    const msg='Assalamualaikum! Saya Assistant Wan Hasbullah. Sila pilih kategori di bawah atau taip soalan anda untuk mencari maklumat berkaitan simpanan dan pelaburan emas.';
    whAddTyping();
    await new Promise(r=>setTimeout(r,1400));
    whRemoveTyping();

    const msgs=$('whMessages'), row=document.createElement('div');
    row.className='wh-msg-row bot';
    row.innerHTML=`<img src="${AVATAR}" class="wh-msg-avatar">
      <div class="wh-bubble-wrap"><div class="wh-bubble bot">
        <span class="wh-sender">Assist Wan</span>
        <span id="whWT"></span><span id="whC" style="animation:whBlink 0.8s step-end infinite">▎</span>
        <span class="wh-time" id="whTM" style="display:none">${whNow()}</span>
      </div></div>`;
    msgs.appendChild(row); whScroll();

    const typed=$('whWT'), cur=$('whC');
    for(let i=0;i<=msg.length;i++){
      typed.textContent=msg.slice(0,i); whScroll();
      await new Promise(r=>setTimeout(r,22));
    }
    cur.remove(); $('whTM').style.display='block'; whScroll(); whSaveChat();

    await whLoadFAQ();
    await new Promise(r=>setTimeout(r,400));
    whShowCategoryInChat();
  }

  /* ─── INIT: Pulihkan chat lama atau mula baru ─── */
  setTimeout(async () => {
    const restored = whRestoreChat();
    if (restored) {
      /* FAQ data perlu diload semula supaya search masih berfungsi */
      await whLoadFAQ();
      /* Tunjuk semula category pills */
      whShowCategoryPills();
      /* Tunjuk semula category menu di bawah mesej yang dipulihkan */
      whShowCategoryInChat();
    } else {
      whWelcome();
    }
  }, 300);
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant Wan Hasbullah</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #0A2342;
  --primary-mid: #1B3E6E;
  --accent: #00B4D8;
  --accent-light: #90E0EF;
  --accent-glow: rgba(0,180,216,0.15);
  --surface: #F0F4FA;
  --surface2: #E4EAF5;
  --bubble-bot: #FFFFFF;
  --bubble-user: linear-gradient(135deg, #00B4D8 0%, #0077B6 100%);
  --text: #0A1628;
  --text-muted: #5A6B85;
  --text-light: #9AAEC4;
  --border: rgba(0,60,120,0.1);
  --border-accent: rgba(0,180,216,0.25);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--surface);
}

#wh-chat-app {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 9999;
  display: flex; flex-direction: column;
  background: var(--surface);
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: var(--text);
  max-width: 760px;
  margin: 0 auto;
}

/* ─── HEADER ─── */
#wh-chat-app .wh-header {
  flex-shrink: 0; height: 72px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-mid) 100%);
  display: flex; align-items: center;
  padding: 0 1.25rem; gap: 14px;
  z-index: 10; position: relative;
  box-shadow: 0 2px 20px rgba(10,35,66,0.2);
}
#wh-chat-app .wh-header::after {
  content: ''; position: absolute;
  bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,180,216,0.4), transparent);
}
#wh-chat-app .wh-avatar-wrap { position: relative; flex-shrink: 0; }
#wh-chat-app .wh-avatar {
  width: 46px; height: 46px; border-radius: 50%;
  object-fit: cover; border: 2.5px solid var(--accent-light); display: block;
}
#wh-chat-app .wh-status-dot {
  position: absolute; bottom: 1px; right: 1px;
  width: 11px; height: 11px; background: #2ECC71;
  border: 2px solid var(--primary); border-radius: 50%;
}
#wh-chat-app .wh-header-info { flex: 1; }
#wh-chat-app .wh-header-name {
  font-family: 'Sora', sans-serif; font-size: 15px;
  font-weight: 600; color: white; letter-spacing: -0.01em;
}
#wh-chat-app .wh-header-status {
  font-size: 12px; color: rgba(255,255,255,0.6);
  margin-top: 1px; display: flex; align-items: center; gap: 5px;
}
#wh-chat-app .wh-header-status::before {
  content: ''; width: 6px; height: 6px;
  background: #2ECC71; border-radius: 50%; display: inline-block;
}
#wh-chat-app .wh-header-actions { display: flex; gap: 8px; }
#wh-chat-app .wh-header-btn {
  width: 38px; height: 38px; background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; text-decoration: none;
}
#wh-chat-app .wh-header-btn:hover { background: rgba(255,255,255,0.18); }
#wh-chat-app .wh-header-btn svg { width: 18px; height: 18px; }

/* ─── MESSAGES ─── */
#wh-chat-app .wh-messages {
  flex: 1; overflow-y: auto; padding: 1.25rem;
  display: flex; flex-direction: column; gap: 10px;
  scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
}
#wh-chat-app .wh-messages::-webkit-scrollbar { width: 4px; }
#wh-chat-app .wh-messages::-webkit-scrollbar-track { background: transparent; }
#wh-chat-app .wh-messages::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }

#wh-chat-app .wh-date-divider {
  text-align: center; font-size: 11px; color: var(--text-light);
  font-weight: 500; letter-spacing: 0.05em; padding: 4px 0;
  display: flex; align-items: center; gap: 10px;
}
#wh-chat-app .wh-date-divider::before,
#wh-chat-app .wh-date-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

#wh-chat-app .wh-msg-row {
  display: flex; align-items: flex-end; gap: 8px;
  animation: whMsgIn 0.25s ease forwards;
  opacity: 0; transform: translateY(8px);
}
@keyframes whMsgIn { to { opacity: 1; transform: translateY(0); } }
#wh-chat-app .wh-msg-row.bot { justify-content: flex-start; }

#wh-chat-app .wh-msg-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  object-fit: cover; border: 1.5px solid var(--border-accent);
  flex-shrink: 0; margin-bottom: 2px;
}
#wh-chat-app .wh-bubble-wrap { display: flex; flex-direction: column; max-width: 75%; }

#wh-chat-app .wh-bubble {
  padding: 0.75rem 1rem; border-radius: 18px;
  font-size: 14.5px; line-height: 1.65;
  position: relative; word-break: break-word;
}
#wh-chat-app .wh-bubble.bot {
  background: var(--bubble-bot); color: var(--text);
  border: 1px solid var(--border); border-bottom-left-radius: 6px;
  box-shadow: 0 2px 10px rgba(10,35,66,0.06);
}
#wh-chat-app .wh-bubble.bot .wh-sender {
  font-size: 11px; font-weight: 600; color: var(--accent);
  display: block; margin-bottom: 4px;
  letter-spacing: 0.03em; text-transform: uppercase;
}
#wh-chat-app .wh-bubble .wh-time {
  font-size: 10.5px; color: var(--text-light);
  margin-top: 4px; display: block; text-align: right;
}
#wh-chat-app .wh-bubble a {
  color: var(--accent); text-decoration: underline; word-break: break-all;
}

/* ─── IMAGE BUBBLE ─── */
#wh-chat-app .wh-img-bubble {
  background: var(--bubble-bot); border: 1px solid var(--border);
  border-bottom-left-radius: 6px; border-radius: 18px;
  overflow: hidden; max-width: 75%;
  box-shadow: 0 2px 10px rgba(10,35,66,0.06);
  animation: whMsgIn 0.25s ease forwards;
  opacity: 0; transform: translateY(8px);
}
#wh-chat-app .wh-img-bubble img {
  width: 100%; max-width: 320px; display: block;
  border-radius: 14px;
}
#wh-chat-app .wh-img-bubble .wh-img-caption {
  padding: 0.6rem 0.875rem; font-size: 13.5px;
  color: var(--text-muted); line-height: 1.55;
}
#wh-chat-app .wh-img-bubble .wh-img-time {
  font-size: 10px; color: var(--text-light);
  padding: 0 0.875rem 0.5rem; text-align: right;
}

/* ─── TYPING ─── */
#wh-chat-app .wh-typing-indicator {
  display: flex; align-items: flex-end; gap: 8px;
  animation: whMsgIn 0.25s ease forwards;
  opacity: 0; transform: translateY(8px);
}
#wh-chat-app .wh-typing-bubble {
  background: white; border: 1px solid var(--border);
  border-radius: 18px; border-bottom-left-radius: 6px;
  padding: 0.875rem 1rem;
  display: flex; align-items: center; gap: 5px;
  box-shadow: 0 2px 10px rgba(10,35,66,0.06);
}
#wh-chat-app .wh-typing-dot {
  width: 7px; height: 7px; background: var(--accent-light);
  border-radius: 50%; animation: whTypingPulse 1.2s ease-in-out infinite;
}
#wh-chat-app .wh-typing-dot:nth-child(2) { animation-delay: 0.15s; }
#wh-chat-app .wh-typing-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes whTypingPulse {
  0%,60%,100% { transform:translateY(0); opacity:0.4; }
  30% { transform:translateY(-5px); opacity:1; }
}

/* ─── QUICK REPLY BUTTONS ─── */
#wh-chat-app .wh-quick-replies {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding: 4px 0 4px 40px;
  animation: whMsgIn 0.25s ease forwards;
  opacity: 0; transform: translateY(8px);
}
#wh-chat-app .wh-qr-btn {
  background: white; border: 1.5px solid var(--border-accent);
  border-radius: 50px; padding: 7px 16px;
  font-size: 13px; font-weight: 600; color: var(--primary-mid);
  cursor: pointer; white-space: nowrap;
  transition: all 0.2s; font-family: 'Plus Jakarta Sans', sans-serif;
}
#wh-chat-app .wh-qr-btn:hover {
  background: var(--accent-glow); border-color: var(--accent);
  color: var(--accent); transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(0,180,216,0.2);
}
#wh-chat-app .wh-qr-btn:active { transform: translateY(0); }
#wh-chat-app .wh-qr-btn.disabled { opacity: 0.4; pointer-events: none; }

/* ─── INPUT BAR (display only, not functional) ─── */
#wh-chat-app .wh-input-bar {
  flex-shrink: 0; background: white;
  border-top: 1px solid var(--border);
  padding: 0.875rem 1rem;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 -4px 20px rgba(10,35,66,0.05);
}
#wh-chat-app .wh-input-wrap {
  flex: 1; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: 50px;
  display: flex; align-items: center;
  padding: 0 16px; gap: 8px;
}
#wh-chat-app #whUserInput {
  flex: 1; background: transparent; border: none; outline: none;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14.5px; color: var(--text-light);
  padding: 0.625rem 0; min-width: 0; cursor: not-allowed;
}
#wh-chat-app .wh-send-btn {
  width: 46px; height: 46px;
  background: linear-gradient(135deg, var(--accent) 0%, #0077B6 100%);
  border: none; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.4; cursor: not-allowed;
  box-shadow: 0 4px 14px rgba(0,180,216,0.3);
}
#wh-chat-app .wh-send-btn svg { width: 18px; height: 18px; }

@keyframes whBlink { 0%,100%{opacity:1} 50%{opacity:0} }
</style>
</head>

<script>
(function () {
  'use strict';

  const AVATAR = 'https://blogger.googleusercontent.com/img/a/AVvXsEjH8kKw3_SWdf96cjqIx_j4exadqr0togYGxXJxWA8D7z40VpkkLeyeyRDrZRCdVXdKPA2LuOtxXZ-eRffWfnM0_UPa6g7KGkCLAx0Br1DoJO3MC3P7jZXg6EZ3FsL0zdiI-RRzcf9ArG87YT4WvpQ5V1PEpe7kCQc0C3SePyxBo5ONOFkmAgYKXDOFTyo=s16000';

  const $        = id => document.getElementById(id);
  const whNow    = () => new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
  const whEsc    = s  => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const whScroll = () => setTimeout(() => $('whMessages').scrollTo({ top: $('whMessages').scrollHeight, behavior: 'smooth' }), 80);
  const sleep    = ms => new Promise(r => setTimeout(r, ms));

  const waSvg = `<svg fill="white" viewBox="0 0 24 24" width="16" height="16" style="flex-shrink:0"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`;

  /* ─── TYPING INDICATOR ─── */
  function whAddTyping() {
    whRemoveTyping();
    const d = document.createElement('div');
    d.className = 'wh-typing-indicator'; d.id = 'whTyping';
    d.innerHTML = `<img src="${AVATAR}" class="wh-msg-avatar">
      <div class="wh-typing-bubble">
        <div class="wh-typing-dot"></div>
        <div class="wh-typing-dot"></div>
        <div class="wh-typing-dot"></div>
      </div>`;
    $('whMessages').appendChild(d); whScroll();
  }
  function whRemoveTyping() { const t = $('whTyping'); if (t) t.remove(); }

  /* ─── BOT BUBBLE ─── */
  function whAddBotBubble(html) {
    const msgs = $('whMessages');
    const row  = document.createElement('div');
    row.className = 'wh-msg-row bot';
    row.innerHTML = `<img src="${AVATAR}" class="wh-msg-avatar">
      <div class="wh-bubble-wrap">
        <div class="wh-bubble bot">
          <span class="wh-sender">Assistant Encik Wan</span>${html}
          <span class="wh-time">${whNow()}</span>
        </div>
      </div>`;
    msgs.appendChild(row); whScroll();
  }

  /* ─── IMAGE + CAPTION BUBBLE ─── */
  function whAddImageBubble(imgSrc, caption) {
    const msgs = $('whMessages');
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;gap:8px;align-items:flex-end';
    const avatarImg = document.createElement('img');
    avatarImg.src = AVATAR; avatarImg.className = 'wh-msg-avatar';
    const card = document.createElement('div');
    card.className = 'wh-img-bubble';
    card.innerHTML = `<img src="${whEsc(imgSrc)}" alt="Imej Public Gold" loading="lazy">
      ${caption ? `<div class="wh-img-caption">${caption}</div>` : ''}
      <div class="wh-img-time">${whNow()}</div>`;
    wrap.appendChild(avatarImg); wrap.appendChild(card);
    msgs.appendChild(wrap); whScroll();
  }

  /* ─── QUICK REPLY BUTTONS ─── */
  function whAddQuickReplies(buttons) {
    const msgs = $('whMessages');
    const wrap = document.createElement('div');
    wrap.className = 'wh-quick-replies';
    buttons.forEach(btn => {
      const el = document.createElement('button');
      el.className   = 'wh-qr-btn';
      el.textContent = btn.label;
      el.onclick = () => {
        wrap.querySelectorAll('.wh-qr-btn').forEach(b => b.classList.add('disabled'));
        btn.action();
      };
      wrap.appendChild(el);
    });
    msgs.appendChild(wrap); whScroll();
  }

  /* ─── TYPING THEN BOT ─── */
  async function whBotSay(html, delay = 1200) {
    whAddTyping();
    await sleep(delay);
    whRemoveTyping();
    whAddBotBubble(html);
  }

  /* ─── TYPING THEN IMAGE ─── */
  async function whBotImage(imgSrc, caption, delay = 1300) {
    whAddTyping();
    await sleep(delay);
    whRemoveTyping();
    whAddImageBubble(imgSrc, caption);
  }

  /* ─── TYPEWRITER EFFECT ─── */
  async function whTypewriter(text, delay = 600) {
    const msgs = $('whMessages');
    whAddTyping();
    await sleep(delay);
    whRemoveTyping();
    const row = document.createElement('div');
    row.className = 'wh-msg-row bot';
    row.innerHTML = `<img src="${AVATAR}" class="wh-msg-avatar">
      <div class="wh-bubble-wrap"><div class="wh-bubble bot">
        <span class="wh-sender">Assistant WH</span>
        <span id="whWT"></span><span id="whC" style="animation:whBlink 0.8s step-end infinite">▎</span>
        <span class="wh-time" id="whTM" style="display:none">${whNow()}</span>
      </div></div>`;
    msgs.appendChild(row); whScroll();
    const typed = $('whWT'), cur = $('whC');
    for (let i = 0; i <= text.length; i++) {
      typed.textContent = text.slice(0, i); whScroll();
      await sleep(22);
    }
    cur.remove(); $('whTM').style.display = 'block'; whScroll();
  }

  /* ═══════════════════════════════════════════
     ALIRAN PERBUALAN BARU
  ═══════════════════════════════════════════ */

  /* ── Step: Selepas klik "Simpan Sendiri" ── */
  async function whFlow_SimpanSendiri() {
    window.open('https://wa.me/601126704897?text=Saya%20berminat%20untuk%20simpan%20emas%20sendiri%20di%20Public%20Gold.%20Boleh%20tolong%20guide%20saya%3F', '_blank');
  }

  /* ── Step: Selepas klik "Public Gold simpankan secara percuma" ── */
  async function whFlow_PGSimpan() {
    window.open('https://wa.me/601126704897?text=Saya%20berminat%20untuk%20Public%20Gold%20simpankan%20emas%20saya%20secara%20percuma.%20Boleh%20tolong%20guide%20saya%3F', '_blank');
  }

  /* ── Step: Selepas klik "Ada" (ada soalan) ── */
  async function whFlow_AdaSoalan() {
    window.open('https://wa.me/601126704897?text=Saya%20ada%20beberapa%20soalan%20tentang%20Public%20Gold%20sebelum%20memulakan%20tabungan%20emas.', '_blank');
  }

  /* ── Step: Selepas klik "Tidak, bagaimana cara bermula" ── */
  async function whFlow_CaraBermula() {
    await whBotSay(`
      Cik boleh register sini dulu:<br><br>
      <a href="https://pgolink.com/register-pg" target="_blank">

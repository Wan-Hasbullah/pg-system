<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Follow Up Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e2a22;--mute:#5d716a;--line:#d5e0dc;--bg:#f3f6f5;--green:#13795b;--amber:#c98a00;--wa:#1fa855;
--g0:#dcf3e7;--g1:#dbeafa;--g2:#e8e1f8;--g3:#fde5d3;--g4:#faf0c4;--g5:#f9dce4;--g6:#d5f0f0;--g7:#e9e5d8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:860px;margin:0 auto}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.actions{display:flex;gap:8px}
.btn{font:600 13px inherit;font-family:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--green)}
.btn[disabled]{opacity:.55;cursor:wait}
.tabs{display:flex;gap:6px;max-width:860px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
.tab{flex:0 0 auto;font:600 14px inherit;font-family:inherit;color:var(--mute);background:transparent;border:1px solid transparent;border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.tab b{font-weight:700;margin-left:4px;color:var(--mute)}
.tab[aria-selected=true]{background:var(--ink);color:#fff}
.tab[aria-selected=true] b{color:#bfe6d6}
.status{max-width:860px;margin:6px auto 0;font-size:12px;color:var(--mute);min-height:16px}
.status.err{color:#b3261e;font-weight:600}
main{max-width:860px;margin:0 auto;padding:12px 12px 40px}
.group{border-radius:16px;padding:10px;margin-bottom:12px}
.gl{font-size:12px;font-weight:700;color:var(--ink);opacity:.7;margin:0 4px 8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:rgba(255,255,255,.7);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.row:last-child{margin-bottom:0}
.name{flex:1 1 220px;font-weight:700;font-size:15px;min-width:0;overflow-wrap:anywhere}
.name small{display:inline-block;min-width:26px;color:var(--mute);font-weight:600}
.wa{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:var(--wa);color:#fff;font-weight:700;font-size:13px;text-decoration:none;border-radius:10px;padding:9px 14px}
.wa.off{background:#cfd8d4;color:#6b7b75;pointer-events:none}
.chips{flex:1 0 100%;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;border:1px solid transparent}
.chip.ok{background:var(--green);color:#fff}
.chip.pr{background:#fff3cf;color:#7a5600;border-color:#efd58a}
.chip.no{background:transparent;color:var(--mute);border-color:rgba(14,42,34,.22)}
.msg{text-align:center;color:var(--mute);padding:40px 16px}
:focus-visible{outline:3px solid #1b8f6b;outline-offset:2px}
@media(min-width:640px){.chips{flex:1 0 100%}}
@media(prefers-reduced-motion:no-preference){.tab{transition:background .15s,color .15s}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <h1>Follow Up</h1>
    <div class="actions">
      <a id="sheetBtn" class="btn" target="_blank" rel="noopener">Buka Sheet</a>
      <button id="refreshBtn" class="btn" type="button">Muat semula</button>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Kategori">
    <button class="tab" role="tab" data-tab="Stranger">Stranger <b>-</b></button>
    <button class="tab" role="tab" data-tab="Inner Circle">Inner Circle <b>-</b></button>
    <button class="tab" role="tab" data-tab="Dealer">Dealer <b>-</b></button>
    <button class="tab" role="tab" data-tab="No Tak Aktif">No Tak Aktif <b>-</b></button>
  </nav>
  <p id="status" class="status" role="status"></p>
</header>
<main id="list"></main>
<script>
'use strict';

/* ====== KONFIGURASI (ubah di sini sahaja) ====== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbyA0Z5EVanYAQ0CnUXr-rC-uMRPcECdUPJHk5dsPlisbBE2O5RulP6EydHR61chqMFPSg/exec',      // URL /exec daripada Apps Script
  TOKEN: 'Wn7kQ4xZp9RtL2vMb8Hc5YdF',         // sama dengan TOKEN dalam Code.gs
  SHEET_ID: '19yWf_5j2eJoGnXwvkQgJXpHm7tnZt23eKWWukAIgE0M',
  GIDS: { 'Stranger': '0', 'Inner Circle': '1483812357', 'Dealer': '600246336' }, // No Tak Aktif diambil automatik
  REFRESH_MS: 120000,                       // semak data baharu setiap 2 minit
  GROUP_SIZE: 10,
  COUNTRY_CODE: '60',
  SHOW_EMPTY_TOPICS: true                   // true: topik kosong dipaparkan sebagai "belum"; false: disembunyikan
};
const TABS = ['Stranger', 'Inner Circle', 'Dealer', 'No Tak Aktif'];
const DONE = ['dah', 'true', 'yes', 'ya', '\u2713', '\u2714'];
const PROGRESS = ['proses'];

const $ = (s) => document.querySelector(s);
const lsGet = (k) => { try { return localStorage.getItem('fu_' + k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem('fu_' + k, v); } catch (e) { /* abaikan */ } };

let data = null, busy = false, loadedAt = 0;
let active = TABS.includes(lsGet('tab')) ? lsGet('tab') : TABS[0];

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function waNumber(raw) {
  let d = String(raw || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  else if (d.startsWith('0')) d = CONFIG.COUNTRY_CODE + d.slice(1);
  return d.length >= 9 && d.length <= 15 ? d : '';
}

function topicState(v) {
  const s = String(v || '').trim().toLowerCase();
  if (DONE.includes(s)) return 'ok';
  if (PROGRESS.includes(s)) return 'pr';
  return 'no';
}

function sheetUrl(tab) {
  const gid = (data && data.tabs[tab] && data.tabs[tab].gid) || CONFIG.GIDS[tab];
  return 'https://docs.google.com/spreadsheets/d/' + CONFIG.SHEET_ID + '/edit' + (gid != null ? '#gid=' + gid : '');
}

function setStatus(text, cls) {
  const s = $('#status');
  s.textContent = text;
  s.className = 'status' + (cls ? ' ' + cls : '');
}

function message(text) {
  $('#list').replaceChildren(el('p', 'msg', text));
}

function render() {
  document.querySelectorAll('.tab').forEach((b) => {
    const t = b.dataset.tab;
    b.setAttribute('aria-selected', String(t === active));
    const info = data && data.tabs[t];
    b.querySelector('b').textContent = info && !info.error ? info.rows.length : '-';
  });
  $('#sheetBtn').href = sheetUrl(active);
  if (!data) return;

  const tab = data.tabs[active];
  if (!tab) return message('Tab "' + active + '" tiada dalam respons pelayan.');
  if (tab.error === 'TAB_TIADA') return message('Tab "' + active + '" tidak dijumpai dalam spreadsheet. Semak nama tab dalam Code.gs.');
  if (tab.error === 'HEADER_TIDAK_JUMPA') return message('Header "Name" dan "Telephone" tidak dijumpai pada baris 1 tab "' + active + '".');
  if (!tab.rows.length) return message('Tiada rekod dalam tab ini.');

  const list = $('#list');
  const frag = document.createDocumentFragment();
  let group = null;
  tab.rows.forEach((r, i) => {
    if (i % CONFIG.GROUP_SIZE === 0) {
      const g = Math.floor(i / CONFIG.GROUP_SIZE);
      group = el('section', 'group');
      group.style.background = 'var(--g' + (g % 8) + ')';
      group.append(el('p', 'gl', 'Nama ' + (i + 1) + '\u2013' + Math.min(i + CONFIG.GROUP_SIZE, tab.rows.length)));
      frag.append(group);
    }
    const row = el('article', 'row');
    const name = el('div', 'name');
    name.append(el('small', '', String(i + 1)), document.createTextNode(' ' + r.n));
    const num = waNumber(r.p);
    const wa = el('a', 'wa' + (num ? '' : ' off'), num ? 'WhatsApp' : 'Tiada no. sah');
    if (num) { wa.href = 'https://wa.me/' + num; wa.target = '_blank'; wa.rel = 'noopener'; wa.setAttribute('aria-label', 'WhatsApp ' + r.n); }
    else wa.setAttribute('aria-disabled', 'true');
    const chips = el('div', 'chips');
    tab.topics.forEach((topic, k) => {
      const st = topicState(r.t[k]);
      if (st === 'no' && !CONFIG.SHOW_EMPTY_TOPICS) return;
      const mark = st === 'ok' ? '\u2713 ' : st === 'pr' ? '\u25D0 ' : '';
      const chip = el('span', 'chip ' + st, mark + topic);
      chip.title = st === 'ok' ? 'Sudah' : st === 'pr' ? 'Dalam proses' : 'Belum';
      chips.append(chip);
    });
    row.append(name, wa, chips);
    group.append(row);
  });
  list.replaceChildren(frag);
}

function friendly(e) {
  const m = String(e && e.message);
  if (m === 'CONFIG') return 'API_URL belum ditetapkan dalam script.js.';
  if (m === 'TOKEN_SALAH') return 'Token tidak sepadan. Samakan TOKEN dalam script.js dan Code.gs.';
  if (e && e.name === 'AbortError') return 'Pelayan lambat menjawab. Cuba muat semula.';
  if (m === 'SERVER') return 'Google Apps Script mengalami ralat. Semak akses spreadsheet dan Executions di Apps Script.';
  if (e instanceof TypeError) return 'Tidak dapat sambung. Semak internet, dan pastikan Web App di-deploy dengan akses "Anyone".';
  return 'Data gagal dimuatkan. Cuba muat semula sebentar lagi.';
}

async function fetchData(fresh) {
  if (busy) return;
  busy = true;
  $('#refreshBtn').disabled = true;
  setStatus('Memuat data\u2026');
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 20000);
  try {
    if (CONFIG.API_URL.startsWith('GANTI')) throw new Error('CONFIG');
    const u = new URL(CONFIG.API_URL);
    u.searchParams.set('token', CONFIG.TOKEN);
    if (fresh) u.searchParams.set('fresh', '1');
    const res = await fetch(u, { signal: ctl.signal });
    if (!res.ok) throw new Error('HTTP');
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'API');
    data = j;
    loadedAt = Date.now();
    setStatus('Dikemas kini ' + new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' }));
    render();
  } catch (e) {
    setStatus(friendly(e) + (data ? ' Data lama masih dipaparkan.' : ''), 'err');
    if (!data) message('Data belum dapat dipaparkan.');
  } finally {
    clearTimeout(timer);
    busy = false;
    $('#refreshBtn').disabled = false;
  }
}

document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => {
  active = b.dataset.tab;
  lsSet('tab', active);
  render();
  window.scrollTo({ top: 0 });
}));
$('#refreshBtn').addEventListener('click', () => fetchData(true));
setInterval(() => { if (!document.hidden) fetchData(false); }, CONFIG.REFRESH_MS);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - loadedAt > CONFIG.REFRESH_MS) fetchData(false);
});
render();
fetchData(false);
</script>
</body>
</html>

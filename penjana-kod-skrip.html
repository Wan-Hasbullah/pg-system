<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penjana Skrip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e2a22;--mute:#5d716a;--line:#d5e0dc;--bg:#f3f6f5;--green:#13795b;--gold:#c9a500}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.top{background:linear-gradient(135deg,#0e2a22 0%,#15483a 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 20px;box-shadow:inset 0 -1px 0 rgba(233,207,122,.35)}
.wrap{max-width:760px;margin:0 auto}
.top small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#e9cf7a}
.top h1{margin:3px 0 0;font-size:22px;font-weight:800;letter-spacing:-.02em}
main{max-width:760px;margin:0 auto;padding:14px 12px 40px;display:grid;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 6px 20px rgba(14,42,34,.06)}
.lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.fin{width:100%;font-family:inherit;font-weight:600;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px;box-shadow:0 1px 2px rgba(14,42,34,.05);appearance:none;-webkit-appearance:none}
.fin:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(19,121,91,.18)}

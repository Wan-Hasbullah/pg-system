<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadual Tilawah Al-Quran — Mei 2025</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold:       #c9a84c;
      --gold-light: #e8d08a;
      --green:      #2d6a4f;
      --green-light:#52b788;
      --cream:      #fdf8ee;
      --ink:        #1a1208;
      --muted:      #7a6e58;
      --card-bg:    #ffffff;
      --today-bg:   #fff8e1;
      --radius:     14px;
      --shadow:     0 4px 24px rgba(0,0,0,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      padding: 0 0 48px;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(160deg, #1a3a2a 0%, #2d6a4f 60%, #3a8c67 100%);
      padding: 40px 20px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }
    .arabic-title {
      font-family: 'Amiri', serif;
      font-size: clamp(28px, 7vw, 48px);
      color: var(--gold-light);
      line-height: 1.3;
      letter-spacing: 0.02em;
      margin-bottom: 6px;
    }
    .sub-title {
      font-size: clamp(13px, 3.5vw, 16px);
      color: rgba(255,255,255,0.75);
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .month-badge {
      display: inline-block;
      margin-top: 18px;
      background: rgba(201,168,76,0.2);
      border: 1px solid rgba(201,168,76,0.45);
      color: var(--gold-light);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 6px 20px;
      border-radius: 999px;
    }

    /* ── TODAY BANNER ── */
    #today-banner {
      display: none;
      margin: 20px 16px 0;
      background: linear-gradient(135deg, #2d6a4f, #52b788);
      border-radius: var(--radius);
      padding: 16px 20px;
      color: #fff;
      align-items: center;
      gap: 14px;
      box-shadow: 0 6px 20px rgba(45,106,79,0.25);
    }
    #today-banner.show { display: flex; }
    .banner-icon { font-size: 28px; flex-shrink: 0; }
    .banner-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      opacity: 0.8;
      margin-bottom: 2px;
    }
    .banner-info { font-size: clamp(14px, 4vw, 17px); font-weight: 600; }
    .banner-juz { margin-left: auto; text-align: center; flex-shrink: 0; }
    .banner-juz-num {
      font-family: 'Amiri', serif;
      font-size: clamp(28px, 8vw, 42px);
      line-height: 1;
      color: var(--gold-light);
    }
    .banner-juz-label {
      font-size: 10px;
      opacity: 0.75;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── TABLE ── */
    .table-wrap {
      margin: 20px 16px 0;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: var(--green); }
    thead th {
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 14px 16px;
      text-align: left;
    }
    thead th:last-child { text-align: center; }
    tbody tr { border-bottom: 1px solid #f0ece2; transition: background 0.2s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #faf6ec; }
    td { padding: 12px 16px; font-size: clamp(13px, 3.8vw, 15px); }
    .td-date { font-weight: 500; white-space: nowrap; }
    .td-day { color: var(--muted); font-size: clamp(11px, 3vw, 13px); font-weight: 300; }
    .td-juz { text-align: center; }
    .juz-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px; height: 38px;
      border-radius: 50%;
      font-family: 'Amiri', serif;
      font-size: 17px; font-weight: 700;
      background: #f0ece2;
      color: var(--green);
    }

    /* ── TODAY ROW ── */
    tr.today-row { background: var(--today-bg) !important; }
    tr.today-row td { padding-top: 14px; padding-bottom: 14px; }
    tr.today-row .juz-pill {
      background: var(--green);
      color: var(--gold-light);
      animation: pulse-ring 1.8s ease-in-out infinite;
    }
    .today-marker {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--gold);
      color: #fff;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 999px;
      margin-top: 4px;
    }
    .blink-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: blink 1s step-start infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(45,106,79,0.45); }
      70%  { box-shadow: 0 0 0 10px rgba(45,106,79,0); }
      100% { box-shadow: 0 0 0 0 rgba(45,106,79,0); }
    }

    /* ── STATS ── */
    .stats-wrap {
      margin: 20px 16px 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 16px 18px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
    }
    .stat-card.green::before { background: linear-gradient(90deg, var(--green), var(--green-light)); }
    .stat-card.gold::before  { background: linear-gradient(90deg, #b8860b, var(--gold-light)); }
    .stat-icon { font-size: 22px; margin-bottom: 8px; display: block; }
    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    .stat-number {
      font-family: 'Amiri', serif;
      font-size: clamp(34px, 10vw, 52px);
      line-height: 1;
      font-weight: 700;
    }
    .stat-card.green .stat-number { color: var(--green); }
    .stat-card.gold  .stat-number { color: #b8860b; }
    .stat-sub  { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .stat-since { font-size: 10px; color: #bbb; margin-top: 4px; letter-spacing: 0.05em; }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      margin-top: 28px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.05em;
    }
    footer span { color: var(--green); font-weight: 600; }

    @media (max-width: 380px) {
      thead th, td { padding-left: 12px; padding-right: 12px; }
      .juz-pill { width: 34px; height: 34px; font-size: 15px; }
    }
  </style>
</head>
<body>

<header>
  <div class="arabic-title">جَدْوَل تِلَاوَة الْقُرْآن</div>
  <div class="sub-title">Jadual Tilawah Al-Quran</div>
  <div class="month-badge">Mei 2025</div>
</header>

<div id="today-banner">
  <div class="banner-icon">📖</div>
  <div>
    <div class="banner-label">Hari Ini</div>
    <div class="banner-info" id="banner-date">—</div>
  </div>
  <div class="banner-juz">
    <div class="banner-juz-num" id="banner-juz">—</div>
    <div class="banner-juz-label">Juz Tilawah</div>
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Tarikh</th>
        <th>Hari</th>
        <th style="text-align:center">Juz Tilawah</th>
      </tr>
    </thead>
    <tbody id="schedule-body"></tbody>
  </table>
</div>

<div class="stats-wrap">
  <div class="stat-card green">
    <span class="stat-icon">📅</span>
    <div class="stat-label">Jumlah Hari</div>
    <div class="stat-number" id="stat-days">—</div>
    <div class="stat-sub">hari</div>
    <div class="stat-since">Sejak 25 Okt 2016</div>
  </div>
  <div class="stat-card gold">
    <span class="stat-icon">🌙</span>
    <div class="stat-label">Jumlah Khatam</div>
    <div class="stat-number" id="stat-juz">—</div>
    <div class="stat-sub">kali khatam</div>
    <div class="stat-since">Sejak 25 Okt 2016</div>
  </div>
</div>

<footer>
  Dikemaskini secara automatik &mdash; <span>Semoga istiqamah</span> 🌿
</footer>

<script>
  const schedule = [
    { date: "1-May",  day: "Jumaat",  juz: 21 },
    { date: "2-May",  day: "Sabtu",   juz: 22 },
    { date: "3-May",  day: "Ahad",    juz: 23 },
    { date: "4-May",  day: "Isnin",   juz: 24 },
    { date: "5-May",  day: "Selasa",  juz: 25 },
    { date: "6-May",  day: "Rabu",    juz: 26 },
    { date: "7-May",  day: "Khamis",  juz: 27 },
    { date: "8-May",  day: "Jumaat",  juz: 28 },
    { date: "9-May",  day: "Sabtu",   juz: 29 },
    { date: "10-May", day: "Ahad",    juz: 30 },
    { date: "11-May", day: "Isnin",   juz: 1  },
    { date: "12-May", day: "Selasa",  juz: 2  },
    { date: "13-May", day: "Rabu",    juz: 3  },
    { date: "14-May", day: "Khamis",  juz: 4  },
    { date: "15-May", day: "Jumaat",  juz: 5  },
    { date: "16-May", day: "Sabtu",   juz: 6  },
    { date: "17-May", day: "Ahad",    juz: 7  },
    { date: "18-May", day: "Isnin",   juz: 8  },
    { date: "19-May", day: "Selasa",  juz: 9  },
    { date: "20-May", day: "Rabu",    juz: 10 },
    { date: "21-May", day: "Khamis",  juz: 11 },
    { date: "22-May", day: "Jumaat",  juz: 12 },
    { date: "23-May", day: "Sabtu",   juz: 13 },
    { date: "24-May", day: "Ahad",    juz: 14 },
    { date: "25-May", day: "Isnin",   juz: 15 },
    { date: "26-May", day: "Selasa",  juz: 16 },
    { date: "27-May", day: "Rabu",    juz: 17 },
    { date: "28-May", day: "Khamis",  juz: 18 },
    { date: "29-May", day: "Jumaat",  juz: 19 },
    { date: "30-May", day: "Sabtu",   juz: 20 },
    { date: "31-May", day: "Ahad",    juz: 21 },
  ];

  const now   = new Date();
  const month = now.getMonth();
  const dayN  = now.getDate();
  const isMay = (month === 4);

  const tbody = document.getElementById('schedule-body');

  schedule.forEach((row, i) => {
    const isToday = isMay && (i + 1 === dayN);
    const tr = document.createElement('tr');
    if (isToday) {
      tr.className = 'today-row';
      document.getElementById('today-banner').classList.add('show');
      document.getElementById('banner-date').textContent = `${row.day}, ${row.date} 2025`;
      document.getElementById('banner-juz').textContent  = row.juz;
    }
    tr.innerHTML = `
      <td class="td-date">
        ${row.date}
        ${isToday ? `<div><span class="today-marker"><span class="blink-dot"></span>Hari Ini</span></div>` : ''}
      </td>
      <td class="td-day">${row.day}</td>
      <td class="td-juz"><span class="juz-pill">${row.juz}</span></td>
    `;
    tbody.appendChild(tr);
  });

  const todayRow = document.querySelector('.today-row');
  if (todayRow) {
    setTimeout(() => todayRow.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
  }

  // Stats: kiraan hari & khatam sejak 25 Okt 2016
  const startDate = new Date(2016, 9, 25); // 25 Oktober 2016
  const today     = new Date();
  today.setHours(0, 0, 0, 0);
  startDate.setHours(0, 0, 0, 0);
  const diffDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
  const khatam   = Math.floor(diffDays / 30); // 1 khatam = 30 juz

  function animateCount(el, target, duration) {
    const start = performance.now();
    const update = (time) => {
      const progress = Math.min((time - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.floor(eased * target).toLocaleString('ms-MY');
      if (progress < 1) requestAnimationFrame(update);
    };
    requestAnimationFrame(update);
  }

  animateCount(document.getElementById('stat-days'), diffDays, 1200);
  animateCount(document.getElementById('stat-juz'),  khatam,   1200);
</script>
</body>
</html>

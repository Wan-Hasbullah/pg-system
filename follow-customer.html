<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ledger — Referral Circle CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#090b10;
    --surface:#11141c;
    --surface-raised:#171b25;
    --surface-hover:#1d2230;
    --border:#242a38;
    --border-strong:#333b4d;
    --gold:#c9a46b;
    --gold-soft:rgba(201,164,107,.12);
    --gold-strong:#e0bd85;
    --emerald:#2bc48a;
    --emerald-soft:rgba(43,196,138,.13);
    --coral:#e2645a;
    --coral-soft:rgba(226,100,90,.13);
    --text-hi:#f2f4f7;
    --text-mid:#a6aec0;
    --text-lo:#666f83;
    --radius:14px;
    --radius-sm:9px;
    --shadow-lift: 0 20px 50px -20px rgba(0,0,0,.6);
    font-size:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(201,164,107,.08), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(43,196,138,.05), transparent 55%),
      var(--ink);
    color:var(--text-hi);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold-soft); color:var(--gold-strong); }
  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  input, select{ font-family:inherit; }

  .app{ max-width:1180px; margin:0 auto; padding:20px 20px 90px; }

  /* ---------- Orbit mark (signature element) ---------- */
  .orbit{ display:inline-block; }
  .orbit circle.ring{ fill:none; stroke:currentColor; stroke-width:1.6; opacity:.55; }
  .orbit circle.core{ fill:currentColor; }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex; align-items:center; gap:18px;
    padding:18px 4px 22px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; color:var(--gold); }
  .brand .wordmark{
    font-family:'Sora',sans-serif; font-weight:700; font-size:1.15rem;
    color:var(--text-hi); letter-spacing:.01em;
  }
  .brand .wordmark span{ color:var(--gold); }
  .brand .tagline{ font-size:.7rem; color:var(--text-lo); letter-spacing:.14em; text-transform:uppercase; margin-left:2px; }

  .day-tabs{
    display:flex; gap:6px; overflow-x:auto; padding:4px;
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    margin-left:auto;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .day-tabs::-webkit-scrollbar{ display:none; }
  .day-tab{
    border:none; background:transparent; color:var(--text-mid);
    font-size:.82rem; font-weight:600; padding:8px 15px; border-radius:999px;
    white-space:nowrap; transition:.2s ease;
  }
  .day-tab:hover{ color:var(--text-hi); }
  .day-tab.active{ background:var(--gold); color:#1a1305; }

  .topbar-actions{ display:flex; gap:10px; width:100%; }
  .search-box{
    flex:1; display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:10px 14px; color:var(--text-mid);
  }
  .search-box input{
    flex:1; background:transparent; border:none; outline:none; color:var(--text-hi); font-size:.9rem;
  }
  .btn{
    display:inline-flex; align-items:center; gap:8px; justify-content:center;
    border:1px solid var(--border-strong); background:var(--surface-raised); color:var(--text-hi);
    font-size:.85rem; font-weight:600; padding:10px 16px; border-radius:var(--radius-sm);
    transition:.15s ease; white-space:nowrap;
  }
  .btn:hover{ background:var(--surface-hover); border-color:var(--gold); }
  .btn-gold{ background:var(--gold); border-color:var(--gold); color:#1a1305; }
  .btn-gold:hover{ background:var(--gold-strong); border-color:var(--gold-strong); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--text-mid); padding:8px 10px;}
  .btn-ghost:hover{ background:var(--surface-hover); color:var(--text-hi); }
  .btn-danger{ color:var(--coral); }

  /* ---------- Butang Sheet (pautan terus ke Google Sheet) ---------- */
  .btn-sheet{
    background:var(--emerald-soft);
    border-color:rgba(43,196,138,.4);
    color:var(--emerald);
    text-decoration:none;
    flex-shrink:0;
  }
  .btn-sheet:hover{
    background:rgba(43,196,138,.22);
    border-color:var(--emerald);
    color:var(--emerald);
  }

  /* ---------- Stats strip ---------- */
  .stats-strip{
    display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:6px 0 28px;
  }
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 16px 14px;
  }
  .stat-card .label{ font-size:.68rem; text-transform:uppercase; letter-spacing:.1em; color:var(--text-lo); font-weight:600;}
  .stat-card .value{ font-family:'Sora',sans-serif; font-size:1.6rem; font-weight:700; margin-top:6px; }
  .stat-card.gold .value{ color:var(--gold); }
  .stat-card.emerald .value{ color:var(--emerald); }
  .stat-card.coral .value{ color:var(--coral); }

  /* ---------- Section blocks ---------- */
  .circle-block{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    margin-bottom:22px; overflow:hidden; box-shadow:var(--shadow-lift);
  }
  .circle-block-head{
    display:flex; align-items:center; gap:12px; padding:18px 20px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, rgba(255,255,255,.02), transparent);
  }
  .circle-block-head .orbit{ color:var(--text-mid); }
  .circle-block[data-circle="stranger"] .circle-block-head .orbit{ color:var(--gold); }
  .circle-block[data-circle="inner"] .circle-block-head .orbit{ color:var(--emerald); }
  .circle-block-head h2{ font-family:'Sora',sans-serif; font-size:1.02rem; font-weight:600; }
  .circle-block-head .sub{ font-size:.76rem; color:var(--text-lo); margin-top:2px; }
  .count-pill{
    margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:.78rem;
    background:var(--surface-raised); border:1px solid var(--border-strong); color:var(--text-mid);
    padding:5px 11px; border-radius:999px;
  }
  .add-row-btn{ margin-left:8px; }

  .grid-header, .row-item{
    display:grid;
    grid-template-columns: 44px 1.4fr 1.1fr 1fr 1fr .9fr .95fr 1fr .9fr 78px;
    gap:10px; align-items:center; padding:12px 20px;
  }
  .grid-header{
    font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--text-lo); font-weight:600;
    border-bottom:1px solid var(--border);
  }
  .row-item{ border-bottom:1px solid var(--border); font-size:.86rem; transition:background .15s ease; }
  .row-item:last-child{ border-bottom:none; }
  .row-item:hover{ background:var(--surface-hover); }
  .cell-no{ font-family:'IBM Plex Mono',monospace; color:var(--text-lo); }
  .cell-nama{ font-weight:600; color:var(--text-hi); }
  .cell-nick{ color:var(--text-mid); font-size:.82rem; }
  .cell-phone, .cell-wa{ font-family:'IBM Plex Mono',monospace; font-size:.8rem; color:var(--text-mid); }
  
  /* ---------- Butang Pil WhatsApp Premium ---------- */
  .wa-link{
    display:inline-flex; align-items:center; gap:6px;
    background:linear-gradient(135deg, rgba(43,196,138,.20), rgba(43,196,138,.07));
    border:1px solid rgba(43,196,138,.38);
    color:var(--emerald); text-decoration:none;
    font-weight:600; font-size:.78rem; letter-spacing:.01em;
    padding:6px 12px 6px 10px; border-radius:999px;
    box-shadow:0 2px 10px -6px rgba(43,196,138,.5);
    transition:.18s ease;
  }
  .wa-link svg{ flex-shrink:0; }
  .wa-link:hover{
    background:linear-gradient(135deg, rgba(43,196,138,.32), rgba(43,196,138,.14));
    border-color:var(--emerald); color:var(--emerald);
    transform:translateY(-1px);
    box-shadow:0 8px 16px -8px rgba(43,196,138,.6);
  }
  .wa-link:active{ transform:translateY(0); box-shadow:0 2px 8px -6px rgba(43,196,138,.5); }
  .wa-empty{ color:var(--text-lo); font-family:'IBM Plex Mono',monospace; font-size:.8rem; }
  
  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px;
    font-size:.72rem; font-weight:600; white-space:nowrap;
  }
  .badge-stranger{ background:var(--gold-soft); color:var(--gold-strong); }
  .badge-inner{ background:var(--emerald-soft); color:var(--emerald); }
  .badge-topik{ background:var(--surface-raised); color:var(--text-mid); border:1px solid var(--border-strong); }
  .tick-toggle{
    border:none; border-radius:999px; padding:5px 12px; font-size:.72rem; font-weight:700;
    display:inline-flex; align-items:center; gap:6px;
  }
  .tick-done{ background:var(--emerald-soft); color:var(--emerald); }
  .tick-tiada{ background:var(--coral-soft); color:var(--coral); }
  .row-actions{ display:flex; gap:2px; justify-content:flex-end; }
  .icon-btn{
    width:28px; height:28px; border-radius:8px; border:1px solid transparent; background:transparent;
    color:var(--text-lo); display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ background:var(--surface-hover); color:var(--text-hi); border-color:var(--border-strong); }

  .empty-state{ padding:46px 20px; text-align:center; color:var(--text-lo); }
  .empty-state .orbit{ color:var(--border-strong); margin-bottom:10px; }
  .empty-state strong{ display:block; color:var(--text-mid); font-size:.92rem; margin-bottom:4px; }

  .skeleton-row{ padding:12px 20px; border-bottom:1px solid var(--border); }
  .sk-bar{ height:12px; border-radius:6px; background:linear-gradient(90deg, var(--surface-raised), var(--surface-hover), var(--surface-raised)); background-size:200% 100%; animation:shimmer 1.4s infinite; }
  @keyframes shimmer{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

  /* ---------- Responsive: collapse grid to cards ---------- */
  @media (max-width: 920px){
    .stats-strip{ grid-template-columns:repeat(2,1fr); }
    .stat-card:nth-child(5){ grid-column:span 2; }

    .grid-header{ display:none; }
    .row-item{
      grid-template-columns:1fr; gap:6px; padding:16px 18px; position:relative;
    }
    .row-item > div{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .row-item > div::before{
      content:attr(data-label); font-size:.65rem; text-transform:uppercase; letter-spacing:.08em;
      color:var(--text-lo); font-weight:600; flex:0 0 auto;
    }
    .cell-no{ position:absolute; top:14px; right:18px; }
    .cell-no::before{ content:'' !important; }
    .cell-nama{ font-size:.98rem; }
    .cell-nama::before{ content:'' !important; }
    .row-actions{ justify-content:flex-start; margin-top:6px; }
    .row-actions::before{ content:'' !important; }

    /* Susun semula supaya WhatsApp & Tick (aksi follow-up utama) berada paling atas & mudah ditekan */
    .cell-nama{ order:1; }
    .row-item [data-label="Whatsapp"]{ order:2; padding:6px 0; }
    .row-item [data-label="Tick"]{ order:3; padding:6px 0; }
    .row-item [data-label="No Hp"]{ order:4; }
    .row-item [data-label="Nickname"]{ order:5; }
    .row-item [data-label="Rank"]{ order:6; }
    .row-item [data-label="Circle"]{ order:7; }
    .row-item [data-label="Topik"]{ order:8; }
    .row-item .row-actions{ order:9; }

    /* Sasaran sentuhan lebih besar untuk follow-up pantas di mobile */
    .wa-link{ padding:10px 16px 10px 13px; font-size:.85rem; border-radius:12px; }
    .wa-link svg{ width:15px; height:15px; }
    .tick-toggle{ padding:9px 16px; font-size:.78rem; border-radius:12px; }
    .icon-btn{ width:34px; height:34px; border-radius:9px; }
  }
  @media (max-width: 560px){
    .app{ padding:14px 12px 90px; }
    .topbar{ gap:12px; }
    .day-tabs{ margin-left:0; width:100%; justify-content:flex-start; }
    .topbar-actions{ flex-wrap:wrap; position:sticky; top:0; z-index:20; background:var(--ink); margin:0 -12px; padding:10px 12px; border-bottom:1px solid var(--border); }
    .btn-sheet span{ display:none; }
    .btn-sheet{ padding:10px 12px; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <svg class="orbit" width="30" height="30" viewBox="0 0 30 30">
        <circle class="ring" cx="15" cy="15" r="12"/>
        <circle class="core" cx="15" cy="15" r="4.5"/>
      </svg>
      <div>
        <div class="wordmark">LEDGER<span>.</span></div>
        <div class="tagline">Referral Circle</div>
      </div>
    </div>
    <div class="day-tabs" id="dayTabs"></div>
    <div class="topbar-actions">
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" placeholder="Cari nama, no. hp atau nickname…">
      </div>
      <a href="https://docs.google.com/spreadsheets/d/1NEGxzUFBX8ut9p077kTb6_Kj7y-iVW3H2mCpI-sDvZI/edit?gid=0#gid=0" target="_blank" rel="noopener" class="btn btn-sheet" title="Buka Google Sheet">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>Sheet</span>
      </a>
      <button class="btn" id="refreshBtn" title="Muat semula">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 10-2.6 5.9M20 4v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <section class="stats-strip" id="statsStrip"></section>

  <main id="mainContent"></main>

</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast-region" id="toastRegion"></div>

<script>
/* ============================================================
   CONFIG — ganti dengan URL Web App Google Apps Script anda
   ============================================================ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxyKzyQaos-_iPWTbpiySIA-KyBbtje2gbABSmdjg2FeDB56htfd6F5aixB29F690XpuQ/exec'
};

const DAYS = ['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
const FIELD_ORDER = ['no','nama','noHp','whatsapp','nickname','rank','circle','topik','tick'];

const state = {
  currentDay: 'Ahad',
  cache: {},
  search: ''
};

/* ---------------- Bootstrapping ---------------- */
function init(){
  renderDayTabs();
  bindGlobalEvents();
  loadDay(state.currentDay);
}

function renderDayTabs(){
  const el = document.getElementById('dayTabs');
  el.innerHTML = DAYS.map(d =>
    `<button class="day-tab ${d===state.currentDay?'active':''}" data-day="${d}">${d}</button>`
  ).join('');
  el.querySelectorAll('.day-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.currentDay = btn.dataset.day;
      renderDayTabs();
      loadDay(state.currentDay);
    });
  });
}

function bindGlobalEvents(){
  document.getElementById('refreshBtn').addEventListener('click', ()=> loadDay(state.currentDay, true));
  document.getElementById('searchInput').addEventListener('input', (e)=>{
    state.search = e.target.value.trim().toLowerCase();
    if(state.cache[state.currentDay]) renderMain(state.cache[state.currentDay]);
  });
  document.getElementById('modalBackdrop').addEventListener('click', (e)=>{
    if(e.target.id === 'modalBackdrop') closeModal();
  });
}

/* ---------------- Data loading ---------------- */
async function loadDay(day, force){
  if(state.cache[day] && !force){ renderMain(state.cache[day]); return; }
  renderSkeleton();
  try{
    const res = await fetch(`${CONFIG.API_URL}?action=getDay&day=${encodeURIComponent(day)}`);
    const payload = await res.json();
    if(!payload || payload.error){ throw new Error(payload && payload.error || 'Ralat tidak diketahui'); }
    state.cache[day] = payload;
    renderMain(payload);
  }catch(err){
    renderError(err.message);
    toast('Gagal memuatkan data: ' + err.message, 'error');
  }
}

async function apiPost(body){
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  const json = await res.json();
  if(!json.success) throw new Error(json.error || 'Ralat pelayan');
  return json.data;
}

/* ---------------- Rendering: skeleton / error ---------------- */
function renderSkeleton(){
  document.getElementById('statsStrip').innerHTML = Array(5).fill(0).map(()=>`
    <div class="stat-card"><div class="sk-bar" style="width:60%"></div><div class="sk-bar" style="width:40%;margin-top:10px;height:20px"></div></div>
  `).join('');
  document.getElementById('mainContent').innerHTML = Array(2).fill(0).map(()=>`
    <div class="circle-block">
      <div class="circle-block-head"><div class="sk-bar" style="width:180px;height:16px"></div></div>
      ${Array(4).fill(0).map(()=>`<div class="skeleton-row"><div class="sk-bar" style="width:100%"></div></div>`).join('')}
    </div>
  `).join('');
}

function renderError(msg){
  document.getElementById('mainContent').innerHTML = `
    <div class="circle-block"><div class="empty-state">
      <svg class="orbit" width="34" height="34" viewBox="0 0 30 30"><circle class="ring" cx="15" cy="15" r="12"/><circle class="core" cx="15" cy="15" r="4.5"/></svg>
      <strong>Tidak dapat menyambung ke Ledger</strong>
      ${msg}<br><span style="font-size:.75rem">Semak URL API di dalam CONFIG.API_URL.</span>
    </div></div>`;
}

/* ---------------- Rendering: stats + sections ---------------- */
function renderMain(payload){
  const allRows = payload.sections.flatMap(s => s.rows.map(r => ({...r, _sectionKey:s.key})));
  const done = allRows.filter(r => (r.tick||'').toLowerCase()==='done').length;
  const pending = allRows.filter(r => (r.tick||'').toLowerCase()!=='done' && r.nama).length;
  const strangerCount = payload.sections.find(s=>s.key==='stranger')?.rows.length || 0;
  const innerCount = payload.sections.find(s=>s.key==='inner')?.rows.length || 0;

  document.getElementById('statsStrip').innerHTML = `
    <div class="stat-card"><div class="label">Jumlah Kenalan</div><div class="value">${allRows.length}</div></div>
    <div class="stat-card gold"><div class="label">Stranger</div><div class="value">${strangerCount}</div></div>
    <div class="stat-card emerald"><div class="label">Inner Circle</div><div class="value">${innerCount}</div></div>
    <div class="stat-card emerald"><div class="label">Done</div><div class="value">${done}</div></div>
    <div class="stat-card coral"><div class="label">Pending / Tiada</div><div class="value">${pending}</div></div>
  `;

  document.getElementById('mainContent').innerHTML = payload.sections.map(section => renderSection(payload.day, section)).join('');
  bindRowEvents(payload.day);
}

function filterRows(rows){
  if(!state.search) return rows;
  return rows.filter(r =>
    (r.nama||'').toLowerCase().includes(state.search) ||
    (r.noHp||'').toLowerCase().includes(state.search) ||
    (r.nickname||'').toLowerCase().includes(state.search)
  );
}

function renderSection(day, section){
  const rows = filterRows(section.rows);
  const isStranger = section.key === 'stranger';
  const iconInner = isStranger
    ? `<circle class="ring" cx="15" cy="15" r="11"/>`
    : `<circle class="ring" cx="15" cy="15" r="11"/><circle class="core" cx="15" cy="15" r="5"/>`;

  return `
  <section class="circle-block" data-circle="${section.key}">
    <div class="circle-block-head">
      <svg class="orbit" width="26" height="26" viewBox="0 0 30 30">${iconInner}</svg>
      <div>
        <h2>${section.label}</h2>
        <div class="sub">${isStranger ? 'Prospek luar — belum masuk lingkungan dalaman' : 'Kenalan rapat — sudah dalam lingkaran dalaman'}</div>
      </div>
      <span class="count-pill">${rows.length}/10</span>
      <button class="btn btn-gold add-row-btn" data-action="add" data-section="${section.key}" data-day="${day}">+ Kenalan</button>
    </div>
    <div class="grid-header">
      <div>No</div><div>Nama</div><div>No Hp</div><div>Whatsapp</div><div>Nickname</div><div>Rank</div><div>Circle</div><div>Topik</div><div>Tick</div><div></div>
    </div>
    ${rows.length ? rows.map(r => renderRow(day, section.key, r)).join('') : emptyStateHtml(isStranger)}
  </section>`;
}

function emptyStateHtml(isStranger){
  return `<div class="empty-state">
    <svg class="orbit" width="30" height="30" viewBox="0 0 30 30"><circle class="ring" cx="15" cy="15" r="12"/>${isStranger?'':'<circle class="core" cx="15" cy="15" r="4.5"/>'}</svg>
    <strong>Tiada kenalan lagi</strong>
    Klik "+ Kenalan" untuk tambah rekod baharu.
  </div>`;
}

/* ---------- Fungsi waLink yang Dikemaskini & Selamat ---------- */
function waLink(r) {
  if (!r) return '<div class="wa-empty">—</div>';
  
  // Paksa tukar kepada String dahulu supaya .replace() tidak ralat jika data berbentuk nombor bulat
  const whatsappStr = r.whatsapp ? String(r.whatsapp) : '';
  const noHpStr = r.noHp ? String(r.noHp) : '';
  
  // Ekstrak digit sahaja
  const digits = whatsappStr.replace(/\D/g, '') || noHpStr.replace(/\D/g, '');
  
  // Jika tiada nombor langsung, paparkan gaya kosong premium
  if (!digits) {
    return `<div class="wa-empty">—</div>`;
  }
  
  // Pastikan format antarabangsa yang betul (tambah kod negara 6)
  let formattedDigits = digits;
  if (formattedDigits.startsWith('0')) {
    formattedDigits = '6' + formattedDigits;
  } else if (formattedDigits.startsWith('1')) {
    formattedDigits = '60' + formattedDigits;
  }
  
  // Bina URL WhatsApp
  const url = `https://wa.me/${formattedDigits}`;
  const label = noHpStr ? `+${noHpStr.replace(/\D/g, '')}` : 'WhatsApp';

  // Rekaan butang pil premium fintech gelapan
  return `
    <a href="${url}" target="_blank" class="wa-link" title="Hubungi ${r.nama || 'Pelanggan'} via WhatsApp">
      <svg class="wa-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.335-1.662c1.746.953 3.71 1.455 5.703 1.456h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" fill="currentColor"/>
      </svg>
      <span>${escapeHtml(label)}</span>
    </a>
  `;
}

function renderRow(day, sectionKey, r){
  const tickState = (r.tick||'').toLowerCase()==='done' ? 'done' : 'tiada';
  return `
  <div class="row-item" data-row="${r.rowNumber}">
    <div class="cell-no" data-label="No">${r.no || ''}</div>
    <div class="cell-nama" data-label="Nama">${escapeHtml(r.nama)}</div>
    <div class="cell-phone" data-label="No Hp">${escapeHtml(r.noHp)}</div>
    <div class="cell-wa" data-label="Whatsapp">${waLink(r)}</div>
    <div class="cell-nick" data-label="Nickname">${escapeHtml(r.nickname)}</div>
    <div data-label="Rank"><span class="badge badge-topik">${escapeHtml(r.rank)||'—'}</span></div>
    <div data-label="Circle"><span class="badge ${sectionKey==='stranger'?'badge-stranger':'badge-inner'}">${escapeHtml(r.circle)}</span></div>
    <div data-label="Topik"><span class="badge badge-topik">${escapeHtml(r.topik)||'—'}</span></div>
    <div data-label="Tick">
      <button class="tick-toggle ${tickState==='done'?'tick-done':'tick-tiada'}" data-action="tick" data-row="${r.rowNumber}" data-day="${day}" data-current="${tickState}">
        ${tickState==='done'?'● Done':'○ Tiada'}
      </button>
    </div>
    <div class="row-actions">
      <button class="icon-btn" data-action="edit" data-row="${r.rowNumber}" data-day="${day}" data-section="${sectionKey}" title="Sunting">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M16.5 3.5l4 4L7 21l-4.5.5.5-4.5L16.5 3.5z" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <button class="icon-btn" data-action="delete" data-row="${r.rowNumber}" data-day="${day}" title="Padam">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3m-9 0l1 13h10l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>`;
}

function escapeHtml(v){
  if(v===undefined || v===null) return '';
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- Row-level interactions ---------------- */
function bindRowEvents(day){
  document.querySelectorAll('[data-action="tick"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const next = btn.dataset.current === 'done' ? 'Tiada' : 'Done';
      btn.disabled = true;
      try{
        await apiPost({ action:'updateField', day, row:Number(btn.dataset.row), field:'tick', value: next });
        await loadDay(day, true);
        toast(`Status dikemaskini: ${next}`, 'success');
      }catch(err){ toast('Gagal kemaskini: '+err.message, 'error'); }
      finally{ btn.disabled = false; }
    });
  });

  document.querySelectorAll('[data-action="delete"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Padam kenalan ini? Tindakan ini tidak boleh diundur.')) return;
      try{
        await apiPost({ action:'deleteContact', day, row:Number(btn.dataset.row) });
        await loadDay(day, true);
        toast('Kenalan dipadam', 'success');
      }catch(err){ toast('Gagal padam: '+err.message, 'error'); }
    });
  });

  document.querySelectorAll('[data-action="edit"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const rowNum = Number(btn.dataset.row);
      const section = btn.dataset.section;
      const payload = state.cache[day];
      const row = payload.sections.find(s=>s.key===section).rows.find(r=>r.rowNumber===rowNum);
      openEditModal(day, section, row);
    });
  });

  document.querySelectorAll('[data-action="add"]').forEach(btn=>{
    btn.addEventListener('click', ()=> openAddModal(day, btn.dataset.section));
  });
}

/* ---------------- Modal: edit ---------------- */
function openEditModal(day, sectionKey, row){
  const isStranger = sectionKey === 'stranger';
  const box = document.getElementById('modalBox');
  box.innerHTML = `
    <h3>Sunting Kenalan</h3>
    <div class="modal-sub">${row.nama || 'Rekod'} · Baris ${row.rowNumber}</div>
    <div class="field"><label>Nama</label><input id="f_nama" value="${escapeHtml(row.nama)}"></div>
    <div class="field-row">
      <div class="field"><label>No Hp</label><input id="f_nohp" value="${escapeHtml(row.noHp)}"></div>
      <div class="field"><label>Whatsapp</label><input id="f_wa" value="${escapeHtml(row.whatsapp)}"></div>
    </div>
    <div class="field"><label>Nickname</label><input id="f_nick" value="${escapeHtml(row.nickname)}"></div>
    <div class="field-row">
      <div class="field"><label>Rank</label><input id="f_rank" value="${escapeHtml(row.rank)}"></div>
      <div class="field"><label>Topik</label><input id="f_topik" value="${escapeHtml(row.topik)}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Circle</label>
        <select id="f_circle">
          <option value="Stranger" ${isStranger?'selected':''}>Stranger</option>
          <option value="Inner Circle" ${!isStranger?'selected':''}>Inner Circle</option>
        </select>
      </div>
      <div class="field"><label>Tick</label>
        <select id="f_tick">
          <option value="Done" ${row.tick==='Done'?'selected':''}>Done</option>
          <option value="Tiada" ${row.tick==='Tiada'?'selected':''}>Tiada</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="cancelBtn">Batal</button>
      <button class="btn btn-gold" id="saveBtn">Simpan</button>
    </div>
  `;
  openModal();
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const updates = {
      nama: val('f_nama'), noHp: val('f_nohp'), whatsapp: val('f_wa'),
      nickname: val('f_nick'), rank: val('f_rank'), topik: val('f_topik'),
      circle: val('f_circle'), tick: val('f_tick')
    };
    try{
      await apiPost({ action:'updateRow', day, row: row.rowNumber, data: updates });
      closeModal();
      await loadDay(day, true);
      toast('Rekod dikemaskini', 'success');
    }catch(err){ toast('Gagal simpan: '+err.message, 'error'); }
  });
}

/* ---------------- Modal: add ---------------- */
function openAddModal(day, sectionKey){
  const isStranger = sectionKey === 'stranger';
  const box = document.getElementById('modalBox');
  box.innerHTML = `
    <h3>Tambah Kenalan Baharu</h3>
    <div class="modal-sub">${isStranger ? 'Siang · Stranger' : 'Malam · Inner Circle'} — ${day}</div>
    <div class="field"><label>Nama</label><input id="f_nama" placeholder="Nama penuh"></div>
    <div class="field-row">
      <div class="field"><label>No Hp</label><input id="f_nohp" placeholder="601xxxxxxxx"></div>
      <div class="field"><label>Whatsapp</label><input id="f_wa" placeholder="601xxxxxxxx"></div>
    </div>
    <div class="field"><label>Nickname</label><input id="f_nick" placeholder="Nama panggilan"></div>
    <div class="field-row">
      <div class="field"><label>Rank</label><input id="f_rank" placeholder="Contoh: Customer"></div>
      <div class="field"><label>Topik</label><input id="f_topik" placeholder="Contoh: Referrer"></div>
    </div>
    <div class="field"><label>Tick</label>
      <select id="f_tick"><option value="Tiada">Tiada</option><option value="Done">Done</option></select>
    </div>
    <div class="modal-actions">
      <button class="btn" id="cancelBtn">Batal</button>
      <button class="btn btn-gold" id="saveBtn">Tambah</button>
    </div>
  `;
  openModal();
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    if(!val('f_nama')){ toast('Nama wajib diisi', 'error'); return; }
    const data = {
      nama: val('f_nama'), noHp: val('f_nohp'), whatsapp: val('f_wa'),
      nickname: val('f_nick'), rank: val('f_rank'), topik: val('f_topik'),
      circle: isStranger ? 'Stranger' : 'Inner Circle', tick: val('f_tick')
    };
    try{
      await apiPost({ action:'addContact', day, section: sectionKey, data });
      closeModal();
      await loadDay(day, true);
      toast('Kenalan baharu ditambah', 'success');
    }catch(err){ toast('Gagal tambah: '+err.message, 'error'); }
  });
}

function val(id){ return document.getElementById(id).value.trim(); }

function openModal(){ document.getElementById('modalBackdrop').classList.add('open'); }
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('open'); }

/* ---------------- Toast ---------------- */
function toast(msg, type='success'){
  const region = document.getElementById('toastRegion');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  region.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2800);
}

init();
</script>
